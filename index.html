<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Inglês</title>
<style>
  :root{
    --ink:#0F1B1A;
    --ink-2:#16302C;
    --paper:#F7F2E5;
    --paper-2:#EFE7D3;
    --gold:#E3A72B;
    --gold-dark:#B9821B;
    --jade:#3F9C6D;
    --jade-bg:#E4F3EA;
    --brick:#C1503A;
    --brick-bg:#FBE7E2;
    --muted:#6C7A72;
    --line: rgba(15,27,26,0.12);
    --shadow: 0 10px 30px rgba(15,27,26,0.25);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(227,167,43,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(63,156,109,0.12), transparent 45%);
    color: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; }
  #app{ max-width: 640px; margin: 0 auto; padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  button,input,textarea,select{font:inherit}button{touch-action:manipulation;min-height:44px}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2f80ed;outline-offset:3px}
  .lesson-tools,.review-dialogue-btn{display:none!important}
  .support-badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#e9f2ff;color:#214d78;font-size:12px;font-weight:800;margin-bottom:10px}
  .error-detail{margin-top:10px;padding:12px;border-left:4px solid var(--gold);background:#fff8e6;border-radius:10px}
  .ambience-status{font-size:12px;color:var(--muted);margin-top:8px}

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .stamp{
    width:44px; height:44px; border-radius:50%;
    border:2px dashed var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; color:var(--gold);
    font-size:13px; flex-shrink:0;
    transform: rotate(-6deg);
  }
  .brand h1{ font-size:19px; margin:0; line-height:1.15; color:var(--paper); }
  .brand span{ font-size:12px; color: rgba(247,242,229,0.6); }

  .reset-btn{
    background:none; border:1px solid rgba(247,242,229,0.25); color: rgba(247,242,229,0.7);
    padding:8px 12px; border-radius:100px; font-size:12px; cursor:pointer; font-family:'Inter';
  }
  .reset-btn:hover{ border-color: var(--brick); color: var(--brick-bg); }

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex: 0 0 auto;
    background: rgba(247,242,229,0.06);
    border:1px solid rgba(247,242,229,0.12);
    color: rgba(247,242,229,0.75);
    padding:10px 16px; border-radius:100px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:'Inter'; white-space:nowrap;
    transition: all .15s ease;
  }
  nav.tabs button.active{
    background: var(--gold); color: var(--ink); border-color: var(--gold);
  }
  nav.tabs button:disabled{ opacity:.35; cursor:not-allowed; }

  .card{
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom:16px;
  }
  .card + .card{ margin-top: 0; }

  .eyebrow{ font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-dark); font-weight:700; margin-bottom:6px; }
  .lesson-title{ font-size: 22px; margin: 0 0 4px; }
  .lesson-sub{ color: var(--muted); font-size: 14px; margin:0 0 14px; }

  .expr-card{ border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; background: #FFFDF8; }
  .expr-en{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; margin:0 0 2px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .listen-btn{
    background: var(--ink); color: var(--paper); border:none; width:34px; height:34px; border-radius:50%;
    cursor:pointer; font-size:15px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .listen-btn:hover{ background: var(--jade); }
  .pron{ font-size:13px; color: var(--muted); font-style:italic; margin:2px 0 8px; }
  .pt-translation{ font-size:15px; margin:0 0 10px; font-weight:500; }
  .meaning-block{ font-size:13.5px; line-height:1.5; margin-bottom:8px; }
  .meaning-block b{ color: var(--ink-2); }
  .usuk{
    display:inline-block; font-size:12px; background: var(--jade-bg); color:#215C41;
    padding:4px 10px; border-radius:8px; margin-top:6px; font-weight:600;
  }
  .context-tag{
    display:inline-block; font-size:12px; background:#FFF0D6; color:#8A5A0B;
    padding:4px 10px; border-radius:8px; margin-top:6px; font-weight:600; margin-left:6px;
  }
  .examples{ margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  .example-line{ font-size:13.5px; margin-bottom:4px; }
  .example-line .en{ font-weight:600; }
  .example-line .pt{ color:var(--muted); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--gold); color: var(--ink); border:none; font-weight:700;
    padding:14px 20px; border-radius:100px; font-size:15px; cursor:pointer; width:100%;
    font-family:'Inter'; transition: transform .1s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{ background: transparent; border:2px solid var(--paper); color: var(--paper); }
  .btn.ghost{ background: rgba(15,27,26,0.06); color: var(--ink); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .progress-bar-wrap{ background: rgba(247,242,229,0.12); border-radius:100px; height:8px; margin-bottom:18px; overflow:hidden; }
  .progress-bar{ background: var(--gold); height:100%; border-radius:100px; transition: width .3s ease; }

  .activity-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .activity-tag{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color: var(--gold-dark); }
  .activity-counter{ font-size:12.5px; color: var(--muted); }

  .prompt{ font-size:18px; font-weight:600; margin: 4px 0 16px; font-family:'Fraunces', serif; line-height:1.35; }
  .prompt .en{ font-size:19px; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .opt-btn{
    text-align:left; border:2px solid var(--line); background:#FFFDF8; padding:13px 16px; border-radius:12px;
    font-size:14.5px; cursor:pointer; font-family:'Inter'; color: var(--ink); font-weight:500;
  }
  .opt-btn:hover{ border-color: var(--gold); }
  .opt-btn.selected{ border-color: var(--gold-dark); background:#FFF3DA; }
  .opt-btn.correct{ border-color: var(--jade); background: var(--jade-bg); color:#1F5C3D; }
  .opt-btn.incorrect{ border-color: var(--brick); background: var(--brick-bg); color:#8C3222; }
  .opt-btn:disabled{ cursor:default; }

  .word-bank{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; min-height:44px; }
  .word-chip{
    background: var(--ink); color: var(--paper); border:none; padding:9px 14px; border-radius:10px;
    font-size:14.5px; cursor:pointer; font-family:'Fraunces', serif;
  }
  .word-chip:disabled{ opacity:.25; cursor:default; }
  .answer-zone{
    min-height:52px; border:2px dashed var(--line); border-radius:12px; padding:10px; display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:14px; background:#FFFDF8;
  }
  .answer-zone .word-chip{ background: var(--gold); color: var(--ink); }

  input.text-input, textarea.text-input{
    width:100%; padding:13px 14px; border-radius:12px; border:2px solid var(--line); font-size:15px;
    font-family:'Inter'; margin-bottom:14px; background:#FFFDF8; color: var(--ink);
  }
  textarea.text-input{ min-height:80px; resize:vertical; }

  .feedback{
    border-radius:14px; padding:15px 16px; margin-bottom:14px; font-size:14px; line-height:1.5;
  }
  .feedback.correct{ background: var(--jade-bg); color:#1F5C3D; border:1px solid #B7DEC7; }
  .feedback.incorrect{ background: var(--brick-bg); color:#8C3222; border:1px solid #E9BEB2; }
  .feedback b{ display:block; margin-bottom:4px; font-size:14.5px; }

  .empty-state{ text-align:center; padding: 30px 10px; color: var(--muted); }
  .empty-state .big{ font-size:34px; margin-bottom:8px; }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:16px; }
  .stat-box{ background:#FFFDF8; border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; }
  .stat-box .num{ font-family:'Fraunces', serif; font-size:28px; font-weight:700; color: var(--ink); }
  .stat-box .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }

  .expr-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:10px;
    background:#FFFDF8; border:1px solid var(--line); margin-bottom:8px; font-size:14px;
  }
  .mastery-pill{ font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:100px; }
  .mastery-pill.low{ background: var(--brick-bg); color:#8C3222; }
  .mastery-pill.mid{ background:#FFF0D6; color:#8A5A0B; }
  .mastery-pill.high{ background: var(--jade-bg); color:#1F5C3D; }

  .group-pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .group-pill{
    font-size:12.5px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#FFFDF8;
    color: var(--muted); font-weight:600;
  }
  .group-pill.done{ background: var(--jade-bg); color:#1F5C3D; border-color:#B7DEC7; }
  .group-pill.current{ background:#FFF3DA; color:#8A5A0B; border-color: var(--gold); }

  .bonus-link{
    display:block; text-align:center; font-size:13px; color: rgba(247,242,229,0.55); margin-top:14px;
    text-decoration:underline; cursor:pointer; background:none; border:none; width:100%; font-family:'Inter';
  }

  /* --- Listening / Speaking / Conversar --- */
  .settings-box{ background:#FFFDF8; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px; }
  .settings-box .eyebrow{ margin-bottom:8px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:2px solid var(--line); background:#fff; color:var(--ink); padding:8px 13px; border-radius:100px;
    font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter';
  }
  .chip.active{ border-color: var(--gold); background:#FFF3DA; }
  .variety-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px;
    border-radius:100px; background: var(--ink); color: var(--paper);
  }
  .speed-row{ display:flex; gap:8px; margin:10px 0 14px; }
  .speed-row button{ flex:1; }
  .listen-phrase-box{
    border:1px solid var(--line); border-radius:14px; padding:18px; background:#FFFDF8; margin-bottom:14px;
    transition: box-shadow .2s ease, transform .15s ease;
  }
  .listen-phrase-box.speaking{ box-shadow: 0 0 0 3px var(--gold); transform: translateY(-1px); }
  .hidden-block{ filter: blur(6px); user-select:none; cursor:pointer; border-radius:8px; padding:2px 6px; background:rgba(15,27,26,0.05); }
  .hidden-block:hover{ filter: blur(3px); }
  .reveal-btn{ font-size:12px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-right:6px; margin-top:6px; }
  .dialogue-turn{ display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; }
  .dialogue-turn.cliente{ flex-direction:row-reverse; text-align:right; }
  .dialogue-bubble{
    flex:1; border-radius:14px; padding:12px 14px; background:#FFFDF8; border:1px solid var(--line);
    transition: box-shadow .2s ease;
  }
  .dialogue-turn.speaking .dialogue-bubble{ box-shadow:0 0 0 3px var(--gold); }
  .speaker-tag{
    flex-shrink:0; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px; background: var(--ink); color:var(--paper);
  }
  .dialogue-turn.cliente .speaker-tag{ background: var(--jade); }
  .mic-btn{
    width:100%; padding:22px; border-radius:20px; border:none; cursor:pointer; font-family:'Fraunces',serif;
    font-size:17px; font-weight:600; background: var(--brick); color:#fff; display:flex; align-items:center;
    justify-content:center; gap:10px; transition: background .15s ease;
  }
  .mic-btn.listening{ background: var(--jade); animation: pulse 1.1s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(63,156,109,0.5);} 70%{ box-shadow:0 0 0 16px rgba(63,156,109,0);} 100%{ box-shadow:0 0 0 0 rgba(63,156,109,0);} }
  .transcript-box{ background:#fff; border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; font-size:15px; }
  .word-tag{ display:inline-block; padding:2px 7px; border-radius:6px; margin:2px; font-size:13px; font-weight:600; }
  .word-tag.ok{ background: var(--jade-bg); color:#1F5C3D; }
  .word-tag.missing{ background: var(--brick-bg); color:#8C3222; text-decoration:line-through; }
  .word-tag.extra{ background:#EDEAE0; color:var(--muted); }
  .disclaimer-note{ font-size:11.5px; color: var(--muted); margin-top:10px; line-height:1.4; }
  .chunk-row{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .chunk-btn{
    background: var(--ink); color:var(--paper); border:none; padding:10px 14px; border-radius:10px;
    font-family:'Fraunces',serif; font-size:14.5px; cursor:pointer;
  }
  .chunk-btn small{ display:block; font-family:'Inter'; font-size:10.5px; opacity:.7; font-weight:400; }
  .stage-row{ display:flex; gap:6px; margin-bottom:14px; }
  .stage-dot{ flex:1; height:6px; border-radius:100px; background: var(--line); }
  .stage-dot.on{ background: var(--gold); }
  .mode-card{
    border:1px solid var(--line); border-radius:16px; padding:18px; background:#FFFDF8; margin-bottom:12px; cursor:pointer;
  }
  .mode-card:hover{ border-color: var(--gold); }
  .mode-card .icon{ font-size:26px; margin-bottom:6px; }
  .hint-box{ background:#FFF3DA; border:1px solid var(--gold); border-radius:12px; padding:12px 14px; font-size:13.5px; margin-top:10px; }
  .no-speech-warning{ background: var(--brick-bg); border:1px solid #E9BEB2; color:#8C3222; border-radius:12px; padding:14px; font-size:13.5px; margin-bottom:14px; }

  /* --- Cena animada --- */
  .scene-box{
    position:relative; height:220px; border-radius:16px; overflow:hidden; margin-bottom:14px;
    background: linear-gradient(180deg, #DCEFE6 0%, #EFE7D3 65%, #D8CBA6 100%);
    border:1px solid var(--line);
  }
  .scene-shelf{ position:absolute; top:10px; left:0; right:0; text-align:center; font-size:22px; letter-spacing:14px; opacity:.55; }
  .scene-floor{ position:absolute; bottom:0; left:0; right:0; height:34px; background: rgba(15,27,26,0.08); }
  .scene-char{ position:absolute; bottom:34px; width:80px; text-align:center; transition: transform .3s ease; }
  .scene-avatar{ font-size:44px; transition: transform .25s ease; }
  .scene-char.talking .scene-avatar{ animation: bob .5s infinite alternate; }
  @keyframes bob{ from{ transform: translateY(0);} to{ transform: translateY(-6px);} }
  .scene-name{ font-size:11px; color: var(--ink-2); font-weight:700; margin-top:2px; }
  .scene-bubble{
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px;
    background:#fff; color:var(--ink); border-radius:12px; padding:8px 12px; font-size:12.5px; font-weight:600;
    box-shadow:0 4px 12px rgba(15,27,26,0.2); white-space:nowrap; max-width:220px; white-space:normal;
  }
  .run-ladder{ display:flex; flex-direction:column; gap:10px; margin: 14px 0; }
  .run-step{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#FFFDF8; }
  .run-step .lvl{ font-size:11px; text-transform:uppercase; font-weight:700; color:var(--gold-dark); letter-spacing:.05em; }
  .run-step .en{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; margin:2px 0; }
  .run-step .pt{ font-size:13px; color:var(--muted); }

  @media (max-width:420px){
    .lesson-title{ font-size:19px; }
    .prompt{ font-size:16.5px; }
  }

  /* Interface integrada v2: três áreas principais e controles acessíveis */
  #app{padding-bottom:112px;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #70CFA0;outline-offset:3px;}
  .topbar{position:relative;z-index:20;}
  .settings-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(247,242,229,.28);background:rgba(247,242,229,.08);color:var(--paper);font-size:20px;cursor:pointer;flex:0 0 auto;}
  .top-actions{display:flex;align-items:center;gap:8px}.account-btn{max-width:190px;min-height:42px;border-radius:22px;border:1px solid rgba(247,242,229,.28);background:rgba(247,242,229,.08);color:var(--paper);padding:7px 12px;cursor:pointer;text-align:left}.account-btn b,.account-btn small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-btn small{opacity:.75;font-size:10px}.sync-note{padding:10px 12px;border-radius:12px;background:#f0ede3;font-size:12px;color:#4e5e59}.sync-note.ok{background:#e5f5e9;color:#176b39}.sync-note.error{background:#fde9e5;color:#9b2c20}.account-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.link-btn{border:0;background:none;color:#8a5a00;text-decoration:underline;cursor:pointer;padding:8px}.auth-error{color:#9b2c20;font-size:13px;margin-top:8px}.auth-success{color:#176b39;font-size:13px;margin-top:8px}
  .auth-gate{min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(circle at top,#234b44 0,#0f1b1a 58%)}.auth-shell{width:min(100%,460px);background:var(--paper);border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 70px rgba(0,0,0,.38);max-height:calc(100dvh - 28px);overflow:auto}.auth-brand{text-align:center;margin-bottom:22px}.brand-lockup{display:flex;align-items:center;justify-content:center;gap:12px}.brand-symbol{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),#f6d778);color:var(--ink);box-shadow:0 8px 20px rgba(180,137,36,.2);transform:rotate(-2deg)}.brand-symbol svg{width:29px;height:29px}.brand-name{font:700 clamp(25px,7vw,34px)/1.05 Georgia,serif;letter-spacing:-.5px;color:var(--ink)}.auth-brand p{margin:9px 0 0;color:var(--muted)}.auth-fields{display:grid;gap:12px}.auth-fields>label:not(.remember-row){font-size:13px;font-weight:700}.auth-fields>label:not(.remember-row)>input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #c9c5b9;border-radius:12px;font:inherit;background:#fff}.auth-actions{display:grid;gap:9px;margin-top:14px}.auth-options{display:grid;gap:6px;margin-top:2px}.remember-row{display:flex!important;gap:11px;align-items:center;min-height:44px;padding:5px 3px;color:var(--ink)!important;font-size:14px!important;font-weight:600!important;cursor:pointer}.remember-row input[type="checkbox"]{appearance:auto!important;width:20px!important;height:20px!important;min-width:20px;margin:0;accent-color:var(--jade);cursor:pointer}.remember-row:focus-within{outline:3px solid rgba(34,124,97,.25);outline-offset:2px;border-radius:8px}.auth-status{text-align:center;padding:18px}.privacy-details{margin-top:13px;text-align:center}.privacy-details summary{display:inline-block;cursor:pointer;co <script>
/* ---------------------------------------------------------
   DADOS: 40 expressões da aula "Compras no supermercado"
--------------------------------------------------------- */
const EXPR = [
  {id:1,g:0,en:"grocery store",pron:"grôusseri stór",pt:"supermercado (mais comum no inglês americano)",
   meaning:"É o jeito mais comum de dizer 'supermercado' nos EUA.",other:"Não tem outro significado comum além desse.",
   usuk:"AmE: grocery store", examples:[
     {en:"I need to go to the grocery store.",pt:"Eu preciso ir ao supermercado."},
     {en:"The grocery store is open until 10pm.",pt:"O supermercado fica aberto até as 22h."}]},
  {id:2,g:0,en:"supermarket",pron:"súpermárket",pt:"supermercado (mais comum no inglês britânico)",
   meaning:"Termo usado tanto nos EUA quanto no Reino Unido, mas é a palavra padrão na Irlanda e no Reino Unido.",
   other:"Nenhum outro significado relevante.",usuk:"BrE/Irlanda: supermarket",examples:[
     {en:"There's a big supermarket near my house.",pt:"Tem um supermercado grande perto da minha casa."},
     {en:"I'll pop into the supermarket after work.",pt:"Vou dar uma passadinha no supermercado depois do trabalho."}]},
  {id:3,g:0,en:"groceries",pron:"grôusseriz",pt:"compras do supermercado / mantimentos",
   meaning:"São os produtos que você compra no mercado (comida, itens de casa), não o lugar.",
   other:"Sempre no plural quando fala dos produtos.",usuk:null,examples:[
     {en:"I need to buy groceries for the week.",pt:"Eu preciso comprar mantimentos para a semana."},
     {en:"Can you help me carry the groceries?",pt:"Você pode me ajudar a carregar as compras?"}]},
  {id:4,g:0,en:"fridge",pron:"fridj",pt:"geladeira",
   meaning:"Forma curta e informal de 'refrigerator', usada no dia a dia.",
   other:"Nenhum outro significado comum.",usuk:null,everyday:"We keep the milk cold in the fridge at home.",examples:[
     {en:"I check the fridge before I go shopping.",pt:"Eu verifico a geladeira antes de ir às compras."},
     {en:"Put the milk back in the fridge.",pt:"Coloque o leite de volta na geladeira."}]},
  {id:5,g:0,en:"pantry",pron:"péntri",pt:"despensa",
   meaning:"Área de armazenamento na cozinha para alimentos secos (massa, arroz, feijão, enlatados).",
   other:"Nos EUA é comum; no Reino Unido hoje soa meio antigo (usam mais 'cupboard').",usuk:"AmE: pantry",examples:[
     {en:"The pasta is in the pantry.",pt:"O macarrão está na despensa."},
     {en:"I organized the pantry last weekend.",pt:"Eu organizei a despensa no fim de semana passado."}]},

  {id:6,g:1,en:"cupboard",pron:"cábord",pt:"armário",
   meaning:"É o equivalente britânico/irlandês de 'pantry' — o armário onde se guarda comida e itens da cozinha.",
   other:"Também pode ser um armário qualquer (de banheiro, de roupas em alguns contextos).",usuk:"BrE/Irlanda: cupboard",examples:[
     {en:"Put the tea bags in the cupboard.",pt:"Coloque os saquinhos de chá no armário."},
     {en:"Check the cupboard — we might be out of pasta.",pt:"Veja no armário — pode ser que tenha acabado o macarrão."}]},
  {id:7,g:1,en:"running low on",pron:"râning lôu ón",pt:"estar ficando com pouco de algo",
   meaning:"O produto ainda existe, mas está quase acabando — hora de prestar atenção.",
   other:"Também se usa para dinheiro, energia, paciência etc. ('running low on patience').",usuk:null,
   everyday:"We're running low on milk at home.",examples:[
     {en:"We're running low on milk.",pt:"Nosso leite está quase acabando."},
     {en:"We're running low on time.",pt:"Nosso tempo está quase acabando."}]},
  {id:8,g:1,en:"running out of",pron:"râning áut âv",pt:"estar acabando (bem próximo do fim)",
   meaning:"Um passo além de 'running low on' — está mesmo acabando, quase no fim.",
   other:"Também usado para tempo: 'running out of time' (o tempo está acabando).",usuk:null,examples:[
     {en:"We're running out of milk.",pt:"Nosso leite está acabando."},
     {en:"The store is running out of Coca-Cola.",pt:"A loja está ficando sem Coca-Cola."}]},
  {id:9,g:1,en:"run out of / have run out of",pron:"rân áut âv",pt:"ficar completamente sem algo / já acabou",
   meaning:"O produto acabou de vez, não sobrou nada.",
   other:"Pode ser usado no passado simples ('we ran out of milk') ou no present perfect ('we've run out of milk').",
   usuk:null,everyday:"My phone has run out of battery.",examples:[
     {en:"We've run out of milk.",pt:"Nosso leite acabou."},
     {en:"The store has run out of Coca-Cola.",pt:"A loja ficou sem Coca-Cola."}]},
  {id:10,g:1,en:"make a list",pron:"mêik â líst",pt:"fazer uma lista",
   meaning:"Escrever os itens que você precisa comprar antes de ir ao mercado.",
   other:"Nenhum outro significado relevante aqui.",usuk:null,examples:[
     {en:"I make a list before I go to the supermarket.",pt:"Eu faço uma lista antes de ir ao supermercado."},
     {en:"Let's make a list so we don't forget anything.",pt:"Vamos fazer uma lista para não esquecer nada."}]},

  {id:11,g:2,en:"avoid overspending",pron:"âvóid ôuverspénding",pt:"evitar gastar demais",
   meaning:"'Avoid' = evitar; 'overspending' = gastar mais do que deveria. Junto: se controlar para não gastar demais.",
   other:"'Avoid' pode vir antes de qualquer verbo: avoid forgetting, avoid buying too much.",usuk:null,
   everyday:"I want to avoid overspending at the supermarket this month.",examples:[
     {en:"I make a list to avoid overspending.",pt:"Eu faço uma lista para evitar gastar demais."},
     {en:"We check prices to avoid overspending.",pt:"A gente confere os preços para evitar gastar demais."}]},
  {id:12,g:2,en:"grab a cart",pron:"gráb â cárt",pt:"pegar um carrinho (inglês americano)",
   meaning:"'Cart' é o carrinho de supermercado nos EUA; 'grab' aqui é só 'pegar' de forma casual.",
   other:"'Grab' também é usado para 'pegar' qualquer coisa rapidamente (grab a coffee, grab a seat).",
   usuk:"AmE: cart",examples:[
     {en:"I grab a cart when I get to the store.",pt:"Eu pego um carrinho quando chego ao mercado."},
     {en:"Let's grab a cart, we have a lot to buy.",pt:"Vamos pegar um carrinho, temos muita coisa para comprar."}]},
  {id:13,g:2,en:"trolley",pron:"tróli",pt:"carrinho de supermercado (inglês britânico/irlandês)",
   meaning:"É a palavra usada na Irlanda e no Reino Unido para o carrinho de supermercado.",
   other:"Também pode ser um carrinho pequeno em geral (de bagagem, por exemplo).",usuk:"BrE/Irlanda: trolley",examples:[
     {en:"I'll get one of the little trolleys.",pt:"Vou pegar um daqueles carrinhos pequenos."},
     {en:"Can you push the trolley?",pt:"Você pode empurrar o carrinho?"}]},
  {id:14,g:2,en:"produce section",pron:"pródius sékshion",pt:"seção de frutas e verduras",
   meaning:"Parte do mercado onde ficam frutas e vegetais frescos.",
   other:"Cuidado com a pronúncia: 'produce' (substantivo, frutas/verduras) tem som diferente de 'produce' (verbo, produzir).",
   usuk:null,examples:[
     {en:"I usually start in the produce section.",pt:"Eu geralmente começo pela seção de frutas e verduras."},
     {en:"The tomatoes are in the produce section.",pt:"Os tomates estão na seção de hortifrúti."}]},
  {id:15,g:2,en:"aisle",pron:"áiol",pt:"corredor do supermercado",
   meaning:"Cada corredor/fileira do mercado, geralmente com um tipo de produto (ex: 'dairy aisle' = corredor dos laticínios).",
   other:"Também existe em cinemas, igrejas e aviões (assento no corredor = 'aisle seat').",usuk:null,examples:[
     {en:"Then I hit the dairy aisle.",pt:"Depois eu passo pelo corredor de laticínios."},
     {en:"The snacks are on aisle 5.",pt:"Os salgadinhos estão no corredor 5."}]},

  {id:16,g:3,en:"on sale",pron:"ón sêil",pt:"em promoção",
   meaning:"Produto com preço reduzido temporariamente.",
   other:"Não confundir com 'for sale' (à venda, disponível para comprar).",usuk:null,examples:[
     {en:"These apples are on sale this week.",pt:"Essas maçãs estão em promoção essa semana."},
     {en:"I look for brands that are on sale.",pt:"Eu procuro marcas que estão em promoção."}]},
  {id:17,g:3,en:"store brand",pron:"stór brénd",pt:"marca própria do supermercado",
   meaning:"Produtos fabricados/vendidos pela própria rede de mercado, geralmente mais baratos que marcas famosas.",
   other:"Também chamado de 'private label' em contextos mais formais de comércio.",usuk:null,examples:[
     {en:"I buy store brand items to save money.",pt:"Eu compro produtos de marca própria para economizar."},
     {en:"The store brand cola tastes almost the same.",pt:"A cola de marca própria tem gosto quase igual."}]},
  {id:18,g:3,en:"shop around",pron:"shóp âráund",pt:"pesquisar / comprar em lugares diferentes para comparar preço",
   meaning:"Em vez de comprar tudo num só lugar, você compara preços em vários mercados/lojas.",
   other:"Também usado fora de compras: 'shop around' para comparar preços de serviços (seguro, internet).",usuk:null,
   everyday:"Sometimes I shop around for better prices on groceries.",examples:[
     {en:"It's easier than shopping around.",pt:"É mais fácil do que ficar pesquisando em vários lugares."},
     {en:"I shop around before buying a new fridge.",pt:"Eu pesquiso em vários lugares antes de comprar uma geladeira nova."}]},
  {id:19,g:3,en:"head to the checkout",pron:"héd tchu dâ tchék-áut",pt:"dirigir-se ao caixa",
   meaning:"Ir até onde você paga pelos produtos.",
   other:"'Head to' pode ser usado para 'ir em direção a' qualquer lugar (head to the airport, head home).",usuk:null,examples:[
     {en:"Once I've got everything, I head to the checkout.",pt:"Assim que tenho tudo, eu vou para o caixa."},
     {en:"Let's head to the checkout, the queue is short.",pt:"Vamos para o caixa, a fila está curta."}]},
  {id:20,g:3,en:"ring someone up",pron:"ríng sámuân âp",pt:"registrar os produtos e cobrar (contexto americano)",
   meaning:"É o que o caixa faz: passar seus produtos e calcular o total a pagar.",
   other:"Fora desse contexto, 'to ring someone up' também pode significar 'ligar para alguém' — no Reino Unido é essa a leitura mais comum!",
   usuk:"AmE: to ring someone up (no caixa) — no Reino Unido soa como 'ligar para alguém'",examples:[
     {en:"The cashier rings me up.",pt:"O caixa registra meus produtos e cobra."},
     {en:"Could you ring me up, please?",pt:"Você pode passar meus produtos, por favor?"}]},

  {id:21,g:4,en:"bag up the groceries",pron:"bág âp dâ grôusseriz",pt:"colocar todas as compras nas sacolas",
   meaning:"Ensacar/embalar os produtos comprados.",
   other:"O 'up' aqui dá a ideia de 'terminar/completar a ação' (colocar tudo, não só parte).",usuk:null,examples:[
     {en:"The cashier bags up all the groceries.",pt:"O caixa coloca todas as compras nas sacolas."},
     {en:"Can you bag up the groceries for me?",pt:"Você pode ensacar as compras para mim?"}]},
  {id:22,g:4,en:"load up the car",pron:"lôud âp dâ cár",pt:"colocar/carregar tudo no carro",
   meaning:"Colocar as sacolas/compras dentro do carro.",
   other:"'Load up' também é usado para carregar qualquer coisa em grande quantidade (load up on supplies).",usuk:null,examples:[
     {en:"I load up the car and head home.",pt:"Eu carrego o carro e vou para casa."},
     {en:"We loaded up the car with our bags.",pt:"A gente carregou o carro com nossas malas."}]},
  {id:23,g:4,en:"do a big shop",pron:"du â bíg shóp",pt:"fazer uma compra grande (expressão britânica/irlandesa)",
   meaning:"Ir ao mercado e comprar bastante coisa de uma vez, geralmente para durar uma ou duas semanas.",
   other:"É diferente de 'go shopping' (que é mais genérico).",usuk:"BrE/Irlanda: do a big shop",examples:[
     {en:"We do a big shop every Saturday.",pt:"A gente faz uma compra grande todo sábado."},
     {en:"I hardly ever do a big shop anymore.",pt:"Eu quase nunca mais faço uma compra grande."}]},
  {id:24,g:4,en:"nip into",pron:"níp íntu",pt:"entrar rapidamente em algum lugar (britânico/irlandês)",
   meaning:"Entrar em um lugar por pouco tempo, tipo uma visita rápida.",
   other:"Também se usa 'nip out' (sair rapidinho) e 'nip to the shop' (dar uma corridinha até a loja).",usuk:"BrE/Irlanda: nip into",examples:[

/* ---------------------------------------------------------
   VERSÃO INDEPENDENTE (index.html): armazenamento local
   Este bloco usa armazenamento local do navegador,
   mantendo uma interface única (window.storage),
   então o resto do app (loadProgress/saveProgress/etc.)
   funciona sem nenhuma alteração de lógica.
--------------------------------------------------------- */
window.storage = {
  async get(key){
    try{
      const raw = localStorage.getItem(key);
      if(raw===null) return null;
      return {key, value: raw};
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); return {key, value}; }
    catch(e){ console.error("localStorage indisponível", e); return null; }
  },
  async delete(key){
    try{ localStorage.removeItem(key); return {key, deleted:true}; }
    catch(e){ return null; }
  },
  async list(prefix){
    try{ return {keys: Object.keys(localStorage).filter(k=>!prefix||k.startsWith(prefix))}; }
    catch(e){ return null; }
  },
};

function exportProgressJSON(){
  const raw = localStorage.getItem(PROFILE_STORAGE_KEY) || localStorage.getItem(STORAGE_KEY) || "{}";
  let safe={};try{safe=stripSensitiveFields(JSON.parse(raw));}catch(e){}
  const blob = new Blob([JSON.stringify(safe,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "caderno-ingles-progresso.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function hasSensitiveKeys(value){if(!value||typeof value!=="object")return false;return Object.keys(value).some(k=>/(password|senha|token|credential|secret|authorization)/i.test(k)||hasSensitiveKeys(value[k]));}
function stripSensitiveFields(value){if(Array.isArray(value))return value.map(stripSensitiveFields);if(!value||typeof value!=="object")return value;const out={};Object.entries(value).forEach(([k,v])=>{if(!/(password|senha|token|credential|secret|authorization)/i.test(k))out[k]=stripSensitiveFields(v);});return out;}
function validateProgressImport(parsed){if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))return {valid:false,error:"O arquivo precisa conter um objeto de progresso."};if(hasSensitiveKeys(parsed))return {valid:false,error:"O arquivo contém senha, token ou credencial e foi recusado."};if(typeof hasUnsafeJsonKeys==="function"&&hasUnsafeJsonKeys(parsed))return {valid:false,error:"O arquivo contém chaves não permitidas."};const pid=activeProfileId(),payload=parsed.profiles&&parsed.profiles[pid]&&parsed.profiles[pid].courses&&parsed.profiles[pid].courses[COURSE_ID]||parsed;if(!payload||typeof payload!=="object")return {valid:false,error:"Estrutura de perfil ou curso inválida."};if(payload.schemaVersion!=null&&(!Number.isInteger(payload.schemaVersion)||payload.schemaVersion<1||payload.schemaVersion>APP_SCHEMA_VERSION))return {valid:false,error:"Versão de progresso incompatível."};for(const key of ["stats","lessonProgress","srsByLesson","attemptRecords"])if(payload[key]!=null&&(typeof payload[key]!=="object"||Array.isArray(payload[key])))return {valid:false,error:`Campo ${key} inválido.`};return {valid:true};}
function importProgressJSON(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){alert("O arquivo de progresso é grande demais.");return;}
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const validation=validateProgressImport(parsed);if(!validation.valid)throw new Error(validation.error);
      if(parsed.profiles&&parsed.profiles[activeProfileId()])await window.storage.set(PROFILE_STORAGE_KEY,JSON.stringify(parsed));
      else{await window.storage.delete(PROFILE_STORAGE_KEY);await window.storage.set(STORAGE_KEY, JSON.stringify(parsed));}
      alert("Progresso importado! Recarregando o app...");
      location.reload();
    }catch(err){
      alert(`Não foi possível importar este arquivo. ${err.message||"Verifique se é um JSON exportado por este app."}`);
    }
  };
  reader.readAsText(file);
}

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state.unlockedGroups = saved.unlockedGroups || 1;
      state.groupSeen = saved.groupSeen || state.groupSeen;
      state.stats = saved.stats || {};
      state.currentGroup = saved.currentGroup || 0;
      if(saved.settings) state.settings = Object.assign(state.settings, saved.settings);
      if(saved.listenStats) state.listenStats = saved.listenStats;
      if(saved.speakStats) state.speakStats = saved.speakStats;
      if(saved.convoUnlockedScenarios) state.convo.unlockedScenarios = saved.convoUnlockedScenarios;
      if(saved.lessonDialogueSeenIntro) state.lesson.dialogueSeenIntro = saved.lessonDialogueSeenIntro;
      if(saved.lessonExprProgress) state.lessonExprProgress = saved.lessonExprProgress;
      if(saved.srs) state.srs = saved.srs;
    }
  }catch(e){ /* sem progresso salvo ainda */ }
  render();
}

async function saveProgress(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      unlockedGroups: state.unlockedGroups,
      groupSeen: state.groupSeen,
      stats: state.stats,
      currentGroup: state.currentGroup,
      settings: state.settings,
      listenStats: state.listenStats,
      speakStats: state.speakStats,
      convoUnlockedScenarios: state.convo.unlockedScenarios,
      lessonDialogueSeenIntro: state.lesson.dialogueSeenIntro,
      lessonExprProgress: state.lessonExprProgress,
      srs: state.srs,
    }), false);
  }catch(e){ console.error("Falha ao salvar progresso", e); }
}

async function resetProgress(){
  if(!confirm("Isso vai apagar todo o seu progresso salvo (incluindo listening, speaking e conversas). Tem certeza?")) return;
  state.unlockedGroups = 1;
  state.groupSeen = [false,false,false,false,false,false,false,false];
  state.stats = {};

  state.listenStats = {};
  state.speakStats = {};
  state.convo.unlockedScenarios = 1;
  state.lesson.dialogueSeenIntro = {};
  state.lessonExprProgress = {};
  state.srs = {};
  state.screen = "aprender";
  await saveProgress();
  render();
}

/* ---------------------------------------------------------
   ÁUDIO (TTS do navegador)
--------------------------------------------------------- */
function getVoiceForVariety(variety){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(variety==="uk"){
    return voices.find(v=>v.lang && v.lang.toLowerCase().includes('en-ie'))
      || voices.find(v=>v.lang && v.lang.toLowerCase().includes('en-gb'))
      || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  }
  return voices.find(v=>v.lang && v.lang.toLowerCase().includes('en-us'))
    || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
}

// speak(text, opts): opts = {variety:'us'|'uk', rate:0.5-1.1, onstart, onend}
function speak(text, opts={}){
  try{
    if(!('speechSynthesis' in window)) return false;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const variety = opts.variety || (state.settings && state.settings.variety) || "us";
    u.lang = variety==="uk" ? "en-IE" : "en-US";
    const pref = getVoiceForVariety(variety);
    if(pref) u.voice = pref;
    u.rate = opts.rate || 0.92;
    if(opts.onstart) u.onstart = opts.onstart;
    if(opts.onend) u.onend = opts.onend;
    u.onerror = opts.onend || (()=>{});
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){ console.error(e); return false; }
}

function speakSequence(items, onEachStart, onAllDone){
  // items: [{text, variety, rate}]
  let i = 0;
  function next(){
    if(i >= items.length){ if(onAllDone) onAllDone(); return; }
    const it = items[i];
    if(onEachStart) onEachStart(i);
    speak(it.text, {variety: it.variety, rate: it.rate, onend: ()=>{ i++; next(); }});
  }
  next();
}

/* ---------------------------------------------------------
   RECONHECIMENTO DE VOZ (Speech Recognition)
--------------------------------------------------------- */
function supportsRecognition(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function supportsSynthesis(){
  return ('speechSynthesis' in window);
}
let activeRecognizer = null;
function startRecognition(variety, onResult, onError, onEnd){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor){ if(onError) onError("no-support"); return null; }
  try{
    const rec = new Ctor();
    rec.lang = variety==="uk" ? "en-IE" : "en-US";
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = true;
    let finalText="";
    rec.onresult = (e)=>{
      let interim="";for(let i=e.resultIndex||0;i<e.results.length;i++){const part=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?" ":"")+part;else interim+=(interim?" ":"")+part;}const text=(finalText+" "+interim).trim();
      if(onResult) onResult(text,{isFinal:!interim,finalText,interim});
    };
    rec.onerror = (e)=>{ if(onError) onError(e.error); };
    rec.onend = ()=>{ if(onEnd) onEnd(); };
    rec.start();
    activeRecognizer = rec;
    return rec;
  }catch(e){ if(onError) onError("start-failed"); return null; }
}
function stopRecognition(){
  try{ if(activeRecognizer) activeRecognizer.stop(); }catch(e){}
}

/* ---------------------------------------------------------
   COMPARAÇÃO DE FALA (transcrição × frase esperada)
--------------------------------------------------------- */
function tokenize(s){
  return normalize(s).split(" ").filter(Boolean);
}
function compareSpeech(expected, recognized){
  const expTokens = tokenize(expected);
  const recTokens = tokenize(recognized);
  const rows=expTokens.length+1,cols=recTokens.length+1,dp=Array.from({length:rows},()=>Array(cols).fill(0));
  for(let i=1;i<rows;i++)for(let j=1;j<cols;j++)dp[i][j]=expTokens[i-1]===recTokens[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const pairs=[];let i=expTokens.length,j=recTokens.length;while(i&&j){if(expTokens[i-1]===recTokens[j-1]){pairs.push([i-1,j-1]);i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
  pairs.reverse();const expMatched=new Set(pairs.map(p=>p[0])),recMatched=new Set(pairs.map(p=>p[1]));
  const matched=pairs.map(p=>expTokens[p[0]]),missing=expTokens.filter((_,n)=>!expMatched.has(n)),extra=recTokens.filter((_,n)=>!recMatched.has(n));
  const coverage=expTokens.length?matched.length/expTokens.length:0,precision=recTokens.length?matched.length/recTokens.length:0;
  const pct=Math.round((coverage*.75+precision*.25)*100);

  let message = "";
  let tips = [];
  if(pct===100 && extra.length===0){
    message = "Muito claro: todas as palavras foram reconhecidas.";
  } else if(pct>=75){
    message = "Sua frase foi compreensível, mesmo com uma pequena diferença.";
    if(missing.length) tips.push(`O sistema não entendeu: ${missing.join(", ")}.`);
  } else if(pct>=40){
    message = "Quase lá: tente novamente esta parte.";
    if(missing.length) tips.push(`Preste atenção em: ${missing.join(", ")}.`);
    tips.push("Fale um pouco mais devagar, palavra por palavra.");
  } else {
    message = "O sistema não entendeu bem essa frase ainda.";
    tips.push("Tente de novo, mais devagar e com calma.");
  }
  // dica de ligação entre palavras quando falta uma expressão composta
  const linking = [["low","on"],["top","up"],["stock","up"],["pop","in"],["nip","into"],["head","to"]];
  linking.forEach(pair=>{
    if(missing.includes(pair[0]) || missing.includes(pair[1])){
      tips.push(`Tente ligar as palavras "${pair[0]} ${pair[1]}" — na fala natural elas quase se juntam em uma só.`);
    }
  });
  return {expTokens,recTokens,matched,matchedIndices:[...expMatched],missing,extra,pct,coverage:Math.round(coverage*100),orderPreserved:true,message,tips};
}
function evaluateSpeech(spec,recognized){
  const expected=spec.expected||spec.en||"",supportMode=spec.supportMode||"independent",alternatives=[expected,...(spec.acceptableAnswers||[])];
  const comparisons=alternatives.map(text=>Object.assign(compareSpeech(text,recognized),{expected:text})).sort((a,b)=>b.pct-a.pct),best=comparisons[0];
  const normalizedHeard=` ${normalize(recognized)} `,essential=(spec.essentialWords||[]).map(normalize),requiredChunks=(spec.requiredChunks||[]).map(normalize);
  best.essentialMissing=essential.filter(w=>!normalizedHeard.includes(` ${w} `));
  best.chunksRecognized=requiredChunks.filter(c=>normalizedHeard.includes(` ${c} `));
  best.chunksMissing=requiredChunks.filter(c=>!normalizedHeard.includes(` ${c} `));
  const threshold=supportMode==="guided"?0:supportMode==="supported"?78:85;
  best.supportMode=supportMode;best.classification=supportMode==="guided"?"Praticado com apoio":supportMode==="supported"?"Respondido com apoio":"Respondido sem ajuda";
  best.threshold=threshold;best.passed=supportMode==="guided"||best.pct>=threshold&&best.essentialMissing.length===0&&best.chunksMissing.length===0;
  return best;
}

/* ---------------------------------------------------------
   CHECAGEM DE RESPOSTA (tolerante)
--------------------------------------------------------- */
function expandContractions(s){
  const map = [["i'm","i am"],["we're","we are"],["we've","we have"],["don't","do not"],
    ["doesn't","does not"],["isn't","is not"],["it's","it is"],["i've","i have"],
    ["can't","cannot"],["won't","will not"],["let's","let us"],["there's","there is"],["that's","that is"]];
  let out = s;
  map.forEach(([k,v])=>{ out = out.split(k).join(v); });
  return out;
}
function normalize(s){
  return expandContractions((s||"").toLowerCase().trim())
    .replace(/[.,!?;:"'’]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function looseMatch(userAnswer, correctAnswer){
  const u = normalize(userAnswer), c = normalize(correctAnswer);
  if(!u) return false;
  if(u===c) return true;
  const stop = new Set(["a","an","the","to","of","in","on","at","i","we","is","are","am","for","and"]);
  const cTokens = c.split(" ").filter(t=>t && !stop.has(t));
  const uSet = new Set(u.split(" "));
  if(cTokens.length===0) return false;
  return cTokens.every(t=>uSet.has(t));
}
function containsKeyPhrase(userAnswer, phrase){
  const u = normalize(userAnswer);
  const p = normalize(phrase);
  return u.includes(p) || p.split(" ").filter(t=>t.length>2).every(t=>u.includes(t));
}

/* ---------------------------------------------------------
   GERAÇÃO DE ATIVIDADES
--------------------------------------------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickDistractors(pool, excludeId, n){
  return shuffle(pool.filter(e=>e.id!==excludeId)).slice(0,n);
}

function buildActivity(expr, type){
  const poolAll = EXPR;
  if(type==="multiple_choice"){
    const distractors = pickDistractors(poolAll.filter(e=>e.g===expr.g || Math.abs(e.g-expr.g)<=1), expr.id, 3);
    const options = shuffle([expr, ...distractors]).map(e=>({key:e.id, label:e.pt.split(" (")[0]}));
    return {type, expr, question:`O que significa "${expr.en}"?`, options, correctKey: expr.id};
  }
  if(type==="fill_blank"){
    const ex = expr.examples[0];
    const words = expr.en.split(" ");
    const mainWord = words[0];
    const blanked = ex.en.replace(new RegExp(expr.en.split(" ")[0], "i"), "____");
    const distractors = shuffle(pickDistractors(poolAll, expr.id, 3).map(e=>e.en.split(" ")[0]));
    const options = shuffle([mainWord, ...distractors]);
    return {type, expr, question:`Complete a frase:`, sentence: blanked, ptHint: ex.pt, options, correctKey: mainWord};
  }
  if(type==="word_order"){
    const ex = expr.examples[Math.floor(Math.random()*expr.examples.length)];
    const words = ex.en.replace(/\./g,"").split(" ");
    return {type, expr, question:"Coloque as palavras na ordem certa para formar a frase:", ptHint: ex.pt,
      target: ex.en.replace(/\.$/,""), pool: shuffle(words)};
  }
  if(type==="translate_pt_en"){
    const ex = expr.examples[Math.floor(Math.random()*expr.examples.length)];
    return {type, expr, question:"Traduza para o inglês:", promptText: ex.pt, correctAnswer: ex.en.replace(/\.$/,"")};
  }
  if(type==="context_meaning"){
    const ex = expr.examples[0];
    const distractors = pickDistractors(poolAll, expr.id, 3).map(e=>e.pt.split(" (")[0]);
    const options = shuffle([expr.meaning.split(".")[0], ...distractors]);
    return {type, expr, question:`Na frase "${ex.en}", o que a expressão destacada quer dizer nesse contexto?`,
      options, correctKey: expr.meaning.split(".")[0]};
  }
  if(type==="listen_choose"){
    const ex = expr.examples[0];
    const distractors = pickDistractors(poolAll.filter(e=>e.g===expr.g), expr.id, 2).map(e=>e.examples[0].en);
    const options = shuffle([ex.en, ...distractors]);
    return {type, expr, question:"Ouça e escolha a frase correta:", audioText: ex.en, options, correctKey: ex.en};
  }
  if(type==="personal"){
    return {type, expr, question:`Escreva uma frase curta do cotidiano usando "${expr.en}".`, keyPhrase: expr.en};
  }
  return null;
}

const TYPE_CYCLE = ["multiple_choice","fill_blank","translate_pt_en","context_meaning","word_order","listen_choose"];

function buildGroupQueue(groupIdx, opts={}){
  const exprs = groupExprs(groupIdx);
  let queue = [];
  exprs.forEach((e,i)=>{
    const t1 = TYPE_CYCLE[i % TYPE_CYCLE.length];
    const t2 = TYPE_CYCLE[(i+3) % TYPE_CYCLE.length];
    queue.push(buildActivity(e, t1));
    queue.push(buildActivity(e, t2));
  });
  // atividades de diferenciação relevantes a este grupo
  DISTINGUISH_PAIRS.forEach(pair=>{
    if(pair.ids.some(id=>exprById(id).g===groupIdx)){
      queue.push({type:"distinguish", pair});
    }
  });
  // uma atividade pessoal para reforçar produção
  const personalExpr = exprs[Math.floor(Math.random()*exprs.length)];
  queue.push(buildActivity(personalExpr, "personal"));
  return shuffle(queue.filter(Boolean));
}

function buildReviewQueue(){
  const weak = EXPR.filter(e=>{
    const s = state.stats[e.id];
    return s && s.wrong > 0;
  }).sort((a,b)=> (state.stats[b.id].wrong) - (state.stats[a.id].wrong));
  let queue = [];
  weak.forEach(e=>{
    const t = TYPE_CYCLE[Math.floor(Math.random()*TYPE_CYCLE.length)];
    queue.push(buildActivity(e, t));
  });
  return queue;
}

function buildFinalChallenge(){
  const available = EXPR.filter(e=> e.g < state.unlockedGroups);
  let queue = [];
  shuffle(available).slice(0, Math.min(20, available.length)).forEach(e=>{
    const t = TYPE_CYCLE[Math.floor(Math.random()*TYPE_CYCLE.length)];
    queue.push(buildActivity(e, t));
  });
  return queue;
}

function resetActivityInputs(){
  state.answered = false;
  state.lastResult = null;
  state.selectedOption = null;
  state.wordOrderPicked = [];
  const act = state.queue[state.qIndex];
  if(act && act.type==="word_order") state.wordOrderPool = act.pool.slice();
}

function submitAnswer(userChoiceOrText){
  const act = state.queue[state.qIndex];
  if(!act || state.answered) return;
  let correct = false, explanation = "";

  if(act.type==="multiple_choice" || act.type==="context_meaning" || act.type==="listen_choose"){
    correct = userChoiceOrText === act.correctKey;
    state.selectedOption = userChoiceOrText;
    explanation = act.expr.meaning + (act.expr.other ? " " + act.expr.other : "");
  } else if(act.type==="fill_blank"){
    correct = userChoiceOrText === act.correctKey;
    state.selectedOption = userChoiceOrText;
    explanation = `A frase completa é: "${act.expr.examples[0].en}" — ${act.expr.examples[0].pt}`;
  } else if(act.type==="word_order"){
    const built = state.wordOrderPicked.join(" ");
    correct = normalize(built) === normalize(act.target);
    explanation = `A frase certa é: "${act.target}" — ${act.ptHint}`;
  } else if(act.type==="translate_pt_en"){
    correct = looseMatch(userChoiceOrText, act.correctAnswer);
    state.selectedOption = userChoiceOrText;
    explanation = `Uma boa tradução é: "${act.correctAnswer}"`;
  } else if(act.type==="distinguish"){
    const correctExpr = exprById(act.pair.correctId);
    correct = userChoiceOrText === act.pair.correctId;
    state.selectedOption = userChoiceOrText;
    explanation = act.pair.note;
  } else if(act.type==="personal"){
    correct = containsKeyPhrase(userChoiceOrText, act.keyPhrase);
    state.selectedOption = userChoiceOrText;
    explanation = correct
      ? `Show! Você usou "${act.keyPhrase}" corretamente na sua frase.`
      : `Tente incluir a expressão "${act.keyPhrase}" na sua frase. Exemplo: "${act.expr.examples[0].en}" — ${act.expr.examples[0].pt}`;
  }

  // registra estatística (não aplica a "distinguish" pois envolve 2 expressões — registra em ambas)
  const targetIds = act.type==="distinguish" ? act.pair.ids : (act.expr ? [act.expr.id] : []);
  targetIds.forEach(id=>{
    const s = ensureStat(id);
    s.seen++;
    if(correct) s.correct++; else s.wrong++;
  });

  state.sessionTotal++;
  if(correct) state.sessionCorrect++;
  state.answered = true;
  state.lastResult = {correct, explanation};
  playFeedbackEffect(correct,`activity:${state.screen}:${state.qIndex}`);

  if(!correct && act.expr) registerModuleError(String(act.expr.id),"legacy");

  saveProgress();
  render();
}

function nextActivity(expectedIndex=state.qIndex){
  if(expectedIndex!==state.qIndex || !state.answered) return;
  state.qIndex++;
  resetActivityInputs();
  if(state.qIndex >= state.queue.length){
    if(state.moduleReinforcement && state.moduleReinforcement.queue.length){
      state.moduleReinforcement.returnScreen = state.screen;
      state.screen = "module-reinforcement";
      saveProgress();
      render();
      return;
    }
    if(state.screen === "praticar"){
      state.unlockedGroups = Math.max(state.unlockedGroups, state.currentGroup+2);
      state.screen = "grupo-completo";
    } else if(state.screen === "revisar-praticando"){
      state.screen = "revisar";
    } else if(state.screen === "desafio-praticando"){
      state.screen = "desafio-fim";
    }
    saveProgress();
  }
  render();
}

function toggleWordChip(word, idx){
  state.wordOrderPicked.push(word);
  state.wordOrderPool.splice(idx,1);
  render();
}
function removeWordChip(idx){
  const w = state.wordOrderPicked[idx];
  state.wordOrderPicked.splice(idx,1);

}

/* ---------------------------------------------------------
   REVISÃO ESPAÇADA (SRS simples)
--------------------------------------------------------- */
const DAY_MS = 24*60*60*1000;
function ensureSrs(id){
  const lessonId=(currentLesson()&&currentLesson().id)||"legacy";
  state.srsByLesson=state.srsByLesson||{};state.srsByLesson[lessonId]=state.srsByLesson[lessonId]||{};
  if(!state.srsByLesson[lessonId][id]) state.srsByLesson[lessonId][id]=Object.assign({correct:0,wrong:0,speakAttempts:0,hintsUsed:0,lastReview:null,nextReview:Date.now(),level:0,noHelpStreak:0,contextsUsed:[],modalitiesPracticed:[]},state.srs[id]||{});
  state.srsByLesson[lessonId][id]=Object.assign({contextsUsed:[],modalitiesPracticed:[],noHelpStreak:0},state.srsByLesson[lessonId][id]);
  return state.srsByLesson[lessonId][id];
}
const SRS_INTERVALS_DAYS = [0, 1, 3, 7, 14, 30]; // nível -> dias até a próxima revisão (0 = ainda hoje/mais tarde na aula)
function scheduleSrs(id, {correct, usedHint,context=null,modality=null}){
  const s = ensureSrs(id);
  s.lastReview = Date.now();
  if(usedHint) s.hintsUsed++;
  if(correct && !usedHint){
    s.correct++;
    s.noHelpStreak = (s.noHelpStreak||0)+1;
    s.level = Math.min(SRS_INTERVALS_DAYS.length-1, s.level+1);
  } else {
    if(!correct) s.wrong++;
    s.noHelpStreak = 0;
    s.level = Math.max(0, s.level - (usedHint?1:2));
  }
  const days = SRS_INTERVALS_DAYS[s.level];
  s.nextReview = Date.now() + (days===0 ? 30*60*1000 : days*DAY_MS); // nível 0 = reaparece daqui ~30min (mais tarde na mesma aula/sessão)
  if(context&&!s.contextsUsed.includes(context))s.contextsUsed.push(context);
  if(modality&&!s.modalitiesPracticed.includes(modality))s.modalitiesPracticed.push(modality);
}
function allLessonExpressions(){
  let out = [];
  LESSONS.forEach(l=> l.expressions.forEach(e=> out.push(Object.assign({lessonId:l.id}, e))));
  return out;
}
function dueSrsExpressions(){
  const now = Date.now();
  return allLessonExpressions().filter(e=>{
    const s = state.srsByLesson&&state.srsByLesson[e.lessonId]&&state.srsByLesson[e.lessonId][e.id];
    return s && s.nextReview <= now;
  });
}

const ADAPTIVE_ACTIVITY_META={explain:{label:"Estudar no contexto",purpose:"apresentar"},recognize:{label:"Reconhecer o significado",purpose:"reconhecer"},listen:{label:"Compreender ouvindo",purpose:"ouvir"},fill:{label:"Completar a frase",purpose:"recuperar"},speak:{label:"Falar a frase",purpose:"produzir"},context:{label:"Aplicar em nova situação",purpose:"aplicar"},participate:{label:"Participar do diálogo",purpose:"interagir"},review:{label:"Revisar sem ajuda",purpose:"revisar"}};
function adaptiveActivityPlan(lesson,expr){const lp=state.lessonProgress[lesson.id]||(state.lessonProgress[lesson.id]={});lp.activityPlans=lp.activityPlans||{};if(lp.activityPlans[expr.id])return lp.activityPlans[expr.id];const s=ensureSrs(expr.id),idx=(lesson.expressions||[]).findIndex(e=>e.id===expr.id);let plan;if(s.wrong>0||s.hintsUsed>1)plan=["explain","listen","recognize","context","fill","speak","participate","review"];else if(idx%2)plan=["explain","listen","fill","recognize","speak","context","participate","review"];else plan=["explain","recognize","listen","fill","speak","context","participate","review"];lp.activityPlans[expr.id]=plan;return plan;}

function renderComparisonSummary(lesson){

function gradeReview(exprId, easy){

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function encodeArg(value){ return encodeURIComponent(JSON.stringify(value)).replace(/'/g,"%27"); }
function decodeArg(value){ return JSON.parse(decodeURIComponent(value)); }

  if(id==="praticar"){
