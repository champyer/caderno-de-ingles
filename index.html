        <div class="pt">${esc(r.pt)}</div>
      </div>`).join("")}
    </div>
    <div class="eyebrow" style="margin-top:14px;">Em situações do cotidiano</div>
    <div class="run-ladder">
      ${RUN_EVERYDAY.map(r=>`<div class="run-step">
        <div class="en">${esc(r.en)} <button class="listen-btn" style="width:26px;height:26px;font-size:12px;" onclick='speak(${JSON.stringify(r.en)})'>🔊</button></div>
        <div class="pt">${esc(r.pt)}</div>
      </div>`).join("")}
    </div>
    <button class="btn secondary" style="margin-top:14px;color:var(--ink);border-color:var(--ink);" onclick="state.showRunBonus=false; render();">Voltar</button>
  </div>`;
}

function render(){
  const app = document.getElementById("app");
  let html = renderTopbar();

  if(state.showRunBonus){
    app.innerHTML = html + renderRunBonus();
    return;
  }

  html += renderTabs();

  switch(state.screen){
    case "aprender": html += renderAprender(); break;
    case "praticar-intro": html += renderPraticarIntro(); break;
    case "praticar": html += renderPraticando(); break;
    case "grupo-completo": html += renderGrupoCompleto(); break;
    case "revisar": html += renderRevisar(); break;
    case "revisar-praticando": html += renderPraticando(); break;
    case "desafio": html += renderDesafioIntro(); break;
    case "desafio-praticando": html += renderPraticando(); break;
    case "desafio-fim": html += renderDesafioFim(); break;
    case "progresso": html += renderProgresso(); break;
    case "ouvir": html += renderOuvirIntro(); break;
    case "ouvir-frase": html += renderOuvirFrase(); break;
    case "ouvir-dialogo": html += renderOuvirDialogo(); break;
    case "falar": html += renderFalarIntro(); break;
    case "falar-pratica": html += renderFalarPratica(); break;
    case "conversar": html += renderConversarIntro(); break;
    case "conversar-jogando": html += renderConversarJogando(); break;
    case "mic-test": html += renderMicTest(); break;
    case "aula": html += renderAulaIntro(); break;
    case "aula-cena": html += renderAulaCena(); break;
    case "aula-expressao": html += renderAulaExpressao(); break;
    case "aula-comparacao": html += renderAulaComparacao(); break;
    case "aula-revisao": html += renderAulaRevisao(); break;
    default: html += renderAprender();
  }

  app.innerHTML = html;
}

/* ===========================================================
   NOVO: SUPORTE / CONFIGURAÇÕES COMPARTILHADAS
=========================================================== */
function renderSupportSettings(){
  const levels = [
    {id:"completo", label:"Apoio completo"},
    {id:"intermediario", label:"Apoio intermediário"},
    {id:"somente-ingles", label:"Somente inglês"},
    {id:"somente-audio", label:"Somente áudio"},
  ];
  return `
  <div class="settings-box">
    <div class="eyebrow">Nível de apoio</div>
    <div class="chip-row">
      ${levels.map(l=>`<button class="chip ${state.settings.supportLevel===l.id?'active':''}"
        onclick="setSupportLevel('${l.id}')">${l.label}</button>`).join("")}
    </div>
    <div class="eyebrow" style="margin-top:12px;">Variedade do inglês</div>
    <div class="chip-row">
      <button class="chip ${state.settings.variety==='us'?'active':''}" onclick="setVariety('us')">🇺🇸 American English</button>
      <button class="chip ${state.settings.variety==='uk'?'active':''}" onclick="setVariety('uk')">🇮🇪 British / Irish English</button>
    </div>
  </div>`;
}
function setSupportLevel(l){ state.settings.supportLevel = l; saveProgress(); render(); }
function setVariety(v){ state.settings.variety = v; saveProgress(); render(); }
function stageFromSupportLevel(){
  return {"completo":1, "intermediario":2, "somente-ingles":3, "somente-audio":4}[state.settings.supportLevel] || 1;
}

/* ===========================================================
   MODO 1 — OUVIR E ENTENDER
=========================================================== */
function ensureListenStat(id){
  if(!state.listenStats[id]) state.listenStats[id] = {correctStreak:0, unlockedStage4:false};
  return state.listenStats[id];
}

function renderOuvirIntro(){
  let html = `<div class="card">
    <div class="eyebrow">Modo 1</div>
    <h2 class="lesson-title">Ouvir e entender</h2>
    <p class="lesson-sub">Uma progressão gradual: primeiro você lê e ouve, depois vai ouvindo com cada vez menos apoio, no seu próprio ritmo.</p>
  </div>`;
  html += renderSupportSettings();

  html += `<div class="card">
    <div class="eyebrow">Frases-chave</div>
    <p class="lesson-sub" style="margin-bottom:12px;">Inclui contrastes importantes: running low on × running out of × run out of, running late × running slowly, cart × trolley, line × queue, checkout × till, top up × stock up.</p>
    <div class="options">
      ${LISTEN_SENTENCES.map(s=>{
        const st = state.listenStats[s.id];
        const mastered = st && st.correctStreak >= 2;
        return `<button class="opt-btn" onclick="openListenSentence('${s.id}')">
          ${esc(s.key)} ${mastered ? '✅' : ''}
        </button>`;
      }).join("")}
    </div>
  </div>`;

  html += `<div class="card">
    <div class="eyebrow">Minidiálogos</div>
    <p class="lesson-sub" style="margin-bottom:10px;">Converse pouco a pouco: ouça o diálogo inteiro, ouça fala por fala, ou pratique interpretando um dos personagens.</p>
    <div class="options">
      ${DIALOGUES.map(d=>`<button class="opt-btn" onclick="openDialogue('${d.id}')">${esc(d.title)}<br><span style="font-size:12px;color:var(--muted);">${esc(d.scenario)}</span></button>`).join("")}
    </div>
  </div>`;
  return html;
}

function openListenSentence(id){
  state.listenCurrent = id;
  state.listenReveal = {pron:false, pt:false};
  state.listenAnswered = false;
  state.listenLastResult = null;
  state.listenTypedAnswer = "";
  state.listenManualHide = false;
  const st = ensureListenStat(id);
  buildListenAttempt(id);
  state.screen = "ouvir-frase";
  render();
}

function buildListenAttempt(id){
  // decide o tipo de atividade com base na etapa efetiva
  const contrast = LISTEN_CONTRASTS.find(c=>c.options.includes(id));
  if(contrast){
    const opts = shuffle(contrast.options.map(oid=>LISTEN_SENTENCES.find(s=>s.id===oid)));
    state.listenAttemptOptions = opts;
  } else {
    state.listenAttemptOptions = null;
  }
}

function effectiveStage(id){
  const st = ensureListenStat(id);
  const base = stageFromSupportLevel();
  if(base >= 4 && !st.unlockedStage4) return 3; // etapa 4 só se já dominou (ou setting força, então liberamos mesmo assim)
  return base;
}

function renderOuvirFrase(){
  const s = LISTEN_SENTENCES.find(x=>x.id===state.listenCurrent);
  if(!s) { state.screen = "ouvir"; return renderOuvirIntro(); }
  const baseStage = effectiveStage(s.id);
  const stage = state.listenManualHide ? 4 : baseStage;
  const st = ensureListenStat(s.id);
  const varietyLabel = state.settings.variety==="uk" ? "🇮🇪 British/Irish English" : "🇺🇸 American English";

  let html = `<div class="card">
    <div class="activity-meta">
      <span class="activity-tag">Ouvir e entender</span>
      <span class="variety-badge">${varietyLabel}</span>
    </div>
    <div class="stage-row">
      ${[1,2,3,4].map(n=>`<div class="stage-dot ${n<=stage?'on':''}"></div>`).join("")}
    </div>
    <div class="listen-phrase-box ${state.listenSpeakingId===s.id?'speaking':''}" id="listenBox">`;

  if(stage <= 3){
    html += `<div class="expr-en">${esc(s.en)}</div>`;
  } else {
    html += `<div class="expr-en" style="opacity:.35;">••• (somente áudio) •••</div>`;
  }

  html += `<div class="speed-row">
    <button class="btn ghost" onclick="playListenSentence('${s.id}', 0.55)">🐢 Lenta</button>
    <button class="btn ghost" onclick="playListenSentence('${s.id}', 0.85)">🚶 Normal</button>
    <button class="btn ghost" onclick="playListenSentence('${s.id}', 1.05)">💨 Natural</button>
  </div>`;
  if(stage < 4){
    html += `<button class="reveal-btn" onclick="state.listenManualHide=true; render();">Já consigo ouvir sem texto</button>`;
  } else if(state.listenManualHide){
    html += `<button class="reveal-btn" onclick="state.listenManualHide=false; render();">Mostrar texto de novo</button>`;
  }

  if(stage>=2){
    html += state.listenReveal.pron
      ? `<div class="pron">/ ${esc(s.pron)} /</div>`
      : `<button class="reveal-btn" onclick="revealListen('pron')">Mostrar pronúncia</button>`;
  } else {
    html += `<div class="pron">/ ${esc(s.pron)} /</div>`;
  }

  if(stage>=2){
    html += state.listenReveal.pt
      ? `<div class="pt-translation">${esc(s.pt)}</div>`
      : `<button class="reveal-btn" onclick="revealListen('pt')">Mostrar tradução</button>`;
  } else {
    html += `<div class="pt-translation">${esc(s.pt)}</div>`;
  }

  if(stage<=1){
    html += `<div class="meaning-block"><b>Expressão principal:</b> ${esc(s.key)}<br><b>Contexto:</b> ${esc(s.note)}</div>`;
  }

  html += `</div>`; // fecha listen-phrase-box

  // Atividade de checagem
  if(state.listenAttemptOptions){
    html += `<div class="eyebrow">Qual frase combina com o áudio?</div>
    <div class="options">${state.listenAttemptOptions.map(o=>{
      let cls = "opt-btn";
      if(state.listenAnswered){
        if(o.id===s.id) cls += " correct";
        else if(o.id===state.listenLastResult?.picked) cls += " incorrect";
      }
      return `<button class="${cls}" ${state.listenAnswered?'disabled':''} onclick="answerListenChoice('${o.id}')">${esc(o.key)}</button>`;
    }).join("")}</div>`;
  } else if(stage>=4 || stage===3){
    html += `<div class="eyebrow">Escreva o que você ouviu:</div>
    <input type="text" class="text-input" id="listenTyped" placeholder="Type in English..." ${state.listenAnswered?'disabled':''} value="${esc(state.listenTypedAnswer)}">
    ${!state.listenAnswered ? `<button class="btn" onclick="answerListenTyped(document.getElementById('listenTyped').value, '${s.id}')">Conferir</button>` : ""}`;
  } else {
    html += `<div class="eyebrow">Você entendeu a frase?</div>
    <div class="options">
      <button class="opt-btn ${state.listenAnswered?'disabled':''}" ${state.listenAnswered?'disabled':''} onclick="answerListenSimple(true,'${s.id}')">Sim, entendi</button>
      <button class="opt-btn" ${state.listenAnswered?'disabled':''} onclick="answerListenSimple(false,'${s.id}')">Ainda não</button>
    </div>`;
  }

  if(state.listenAnswered && state.listenLastResult){
    html += `<div class="feedback ${state.listenLastResult.correct?'correct':'incorrect'}">
      <b>${state.listenLastResult.correct ? '✅ Isso mesmo!' : '💡 Vamos com calma'}</b>
      ${esc(s.en)} — ${esc(s.pt)}<br>
      <span style="font-size:13px;">Expressão: <b>${esc(s.key)}</b> — ${esc(s.note)}</span>
    </div>
    <button class="btn" onclick="finishListenAttempt('${s.id}')">Continuar →</button>`;
  }

  html += `</div>`; // fecha card

  html += `<button class="btn secondary" style="color:var(--paper);border-color:var(--paper);" onclick="state.screen='ouvir'; render();">← Voltar para Ouvir e entender</button>`;
  return html;
}

function revealListen(field){ state.listenReveal[field] = true; render(); }

function playListenSentence(id, rate){
  const s = LISTEN_SENTENCES.find(x=>x.id===id);
  if(!s) return;
  state.listenSpeakingId = id;
  render();
  speak(s.en, {rate, onend: ()=>{ state.listenSpeakingId = null; render(); }});
}

function registerListenResult(id, correct){
  const st = ensureListenStat(id);
  if(correct){ st.correctStreak++; if(st.correctStreak>=2) st.unlockedStage4 = true; }
  else { st.correctStreak = 0; }
}

function answerListenChoice(pickedId){
  if(state.listenAnswered) return;
  const s = LISTEN_SENTENCES.find(x=>x.id===state.listenCurrent);
  const correct = pickedId === s.id;
  registerListenResult(s.id, correct);
  state.listenAnswered = true;
  state.listenLastResult = {correct, picked:pickedId};
  saveProgress();
  render();
}
function answerListenTyped(text, id){
  const s = LISTEN_SENTENCES.find(x=>x.id===id);
  const correct = looseMatch(text, s.en);
  registerListenResult(s.id, correct);
  state.listenAnswered = true;
  state.listenLastResult = {correct};
  saveProgress();
  render();
}
function answerListenSimple(said, id){
  const s = LISTEN_SENTENCES.find(x=>x.id===id);
  registerListenResult(s.id, said);
  state.listenAnswered = true;
  state.listenLastResult = {correct: said};
  saveProgress();
  render();
}
function finishListenAttempt(id){
  if(state.course && state.course.step==="listening"){
    state.course.listeningCompleted = true;
    state.course.maxUnlocked=Math.max(state.course.maxUnlocked,3);if(!state.course.completedSteps.includes("listening"))state.course.completedSteps.push("listening");
    state.course.step = "speaking";
    saveProgress();
    const nextId=(activeLesson().speaking[0]||{}).id;if(nextId)openFluencyPhrase(nextId);else{state.screen="lesson-history";render();}
    return;
  }
  state.screen = "ouvir"; render();
}

/* --- Diálogos --- */
function openDialogue(id){
  state.dialogueId = id;
  state.dialoguePlayIndex = -1;
  state.dialogueRoleplay = null;
  state.dialogueRoleplayStep = 0;
  state.dialogueRoleplayResult = null;
  state.screen = "ouvir-dialogo";
  render();
}

function dialogueText(turn){ return state.settings.variety==="uk" ? turn.uk : turn.us; }

function renderOuvirDialogo(){
  const d = DIALOGUES.find(x=>x.id===state.dialogueId);
  if(!d){ state.screen="ouvir"; return renderOuvirIntro(); }
  const stage = stageFromSupportLevel();
  let html = `<div class="card">
    <div class="eyebrow">Minidiálogo</div>
    <h2 class="lesson-title">${esc(d.title)}</h2>
    <p class="lesson-sub">${esc(d.scenario)}</p>
    <div class="chip-row" style="margin-bottom:14px;">
      <button class="chip" onclick="playFullDialogue('${d.id}')">▶️ Ouvir diálogo completo</button>
      <button class="chip" onclick="state.dialogueRoleplay='cliente'; state.dialogueRoleplayStep=0; state.dialogueRoleplayResult=null; render();">🗣️ Praticar como cliente</button>
      <button class="chip" onclick="state.dialogueRoleplay='funcionario'; state.dialogueRoleplayStep=0; state.dialogueRoleplayResult=null; render();">🧑‍💼 Praticar como funcionário</button>
    </div>`;

  if(state.dialogueRoleplay){
    html += renderDialogueRoleplay(d);
  } else {
    d.turns.forEach((t,i)=>{
      const isCliente = t.speaker==="cliente";
      html += `<div class="dialogue-turn ${isCliente?'cliente':''} ${state.dialoguePlayIndex===i?'speaking':''}">
        <div class="speaker-tag">${isCliente ? '🧑' : '🧑‍💼'}</div>
        <div class="dialogue-bubble">
          <div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px;">${isCliente?'Cliente':'Funcionário'}</div>
          <div class="expr-en" style="font-size:16px;">${esc(dialogueText(t))}</div>
          ${stage>=2 ? `<div class="pron">/ ${esc(t.pron)} /</div>` : ""}
          ${stage>=3 ? `<div class="pt-translation" style="margin:0;">${esc(t.pt)}</div>` : `<div class="pt-translation" style="margin:0;">${esc(t.pt)}</div>`}
          <div style="margin-top:6px;">
            <button class="reveal-btn" onclick="playDialogueTurn('${d.id}',${i})">🔊 Ouvir</button>
            <button class="reveal-btn" onclick="playDialogueTurn('${d.id}',${i})">🔁 Repetir</button>
          </div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  html += `<button class="btn secondary" style="color:var(--paper);border-color:var(--paper);" onclick="state.screen='ouvir'; render();">← Voltar</button>`;
  return html;
}

function playDialogueTurn(dId, i){
  const d = DIALOGUES.find(x=>x.id===dId);
  const t = d.turns[i];
  state.dialoguePlayIndex = i;
  render();
  speak(dialogueText(t), {variety: t.speaker==="funcionario" ? "uk" : "us", onend: ()=>{ state.dialoguePlayIndex=-1; render(); }});
}

function playFullDialogue(dId){
  const d = DIALOGUES.find(x=>x.id===dId);
  const items = d.turns.map(t=>({text: dialogueText(t), variety: t.speaker==="funcionario"?"uk":"us"}));
  speakSequence(items, (i)=>{ state.dialoguePlayIndex=i; render(); }, ()=>{ state.dialoguePlayIndex=-1; render(); });
}

function renderDialogueRoleplay(d){
  const userRole = state.dialogueRoleplay;
  const step = state.dialogueRoleplayStep;
  if(step >= d.turns.length){
    return `<div class="feedback correct"><b>🎉 Diálogo concluído!</b> Você praticou o papel de ${userRole==='cliente'?'cliente':'funcionário'}.</div>
    <button class="btn" onclick="state.dialogueRoleplayStep=0; state.dialogueRoleplayResult=null; render();">Praticar de novo</button>`;
  }
  const t = d.turns[step];
  const isUserTurn = t.speaker === userRole;
  let html = `<div class="dialogue-turn ${t.speaker==='cliente'?'cliente':''} speaking">
    <div class="speaker-tag">${t.speaker==='cliente'?'🧑':'🧑‍💼'}</div>
    <div class="dialogue-bubble">
      <div style="font-size:12px;color:var(--muted);font-weight:700;">${t.speaker==='cliente'?'Cliente':'Funcionário'}</div>`;

  if(!isUserTurn){
    html += `<div class="expr-en" style="font-size:16px;">${esc(dialogueText(t))}</div>
      <div class="pron">/ ${esc(t.pron)} /</div>
      <button class="reveal-btn" onclick="speak(decodeArg('${encodeArg(dialogueText(t))}'),{variety:'${t.speaker==='funcionario'?'uk':'us'}'})">🔊 Ouvir</button>
      <button class="btn" style="margin-top:10px;" onclick="advanceRoleplay('${d.id}')">Continuar →</button>`;
  } else {
    html += `<div style="font-size:13px;color:var(--muted);margin-bottom:8px;">É a sua vez de falar. Dica: "${esc(dialogueText(t))}"</div>`;
    html += renderVoiceCaptureControls("legacy-roleplay",String(d.id),dialogueText(t));
    html += `<details><summary>Alternativa de acessibilidade por escrita</summary><p class="lesson-sub">Esta resposta será registrada como escrita e nunca contará como speaking.</p><input type="text" class="text-input" id="dlgTyped" placeholder="Escreva sua fala em inglês..."><button class="btn ghost" onclick="checkRoleplayAnswer('${d.id}', document.getElementById('dlgTyped').value)">Avaliar como escrita</button></details>`;
    if(state.dialogueRoleplayResult){
      const r = state.dialogueRoleplayResult;
      html += `<div class="transcript-box">Você disse: "${esc(r.heard)}"</div>
      <div class="feedback ${r.pending?'':r.correct?'correct':'incorrect'}"><b>${r.pending?'Speaking pendente':r.correct?'✅ Muito bem!':'💡 Quase lá'}</b>${esc(r.message)}</div>`;
      if(r.correct||r.pending){
        html += `<button class="btn" onclick="advanceRoleplay('${d.id}')">Continuar →</button>`;
      } else {
        html += `<button class="btn ghost" onclick="state.dialogueRoleplayResult=null; render();">Tentar de novo</button>`;
      }
    }
  }
  html += `</div></div>`;
  return html;
}

function micRoleplayCapture(dId){
  const d = DIALOGUES.find(x=>x.id===dId);
  const t = d.turns[state.dialogueRoleplayStep];
  state.micListening = true;
  render();
  startRecognition(state.settings.variety, (text)=>{
    state.micListening = false;
    const cmp = compareSpeech(dialogueText(t), text);
    state.dialogueRoleplayResult = {heard:text, correct: cmp.pct>=75, message: cmp.message};
    render();
  }, (err)=>{
    state.micListening = false;
    state.dialogueRoleplayResult = {heard:"(não entendi)", correct:false, message:"Não consegui ouvir. Tente novamente ou digite sua resposta."};
    render();
  }, ()=>{ state.micListening=false; render(); });
}
function checkRoleplayAnswer(dId, text){
  const d = DIALOGUES.find(x=>x.id===dId);
  const t = d.turns[state.dialogueRoleplayStep];
  const cmp = compareSpeech(dialogueText(t), text);
  state.dialogueRoleplayResult = {heard:text, correct: cmp.pct>=75, message:`${cmp.message} Esta tentativa foi registrada como escrita.`,modality:"writing"};
  recordAttempt(`legacy-roleplay-${dId}-${state.dialogueRoleplayStep}`,cmp.pct>=75?"correct":"incorrect","supported",{modality:"writing",pct:cmp.pct});
  render();
}
function advanceRoleplay(dId){
  state.dialogueRoleplayStep++;
  state.dialogueRoleplayResult = null;
  render();
}

/* ===========================================================
   MODO 2 — FALAR E PRATICAR
=========================================================== */
function ensureSpeakStat(id){
  if(!state.speakStats[id]) state.speakStats[id] = {stage:0, attempts:0, bestPct:0, mastered:false};
  return state.speakStats[id];
}

function renderFalarIntro(){
  const speakingItems=(activeLesson()&&activeLesson().speaking)||[];
  let html = `<div class="card">
    <div class="eyebrow">Modo 2</div>
    <h2 class="lesson-title">Falar e praticar</h2>
    <p class="lesson-sub">Pratique a pronúncia em blocos pequenos antes da frase inteira. O objetivo não é eliminar seu sotaque — é ficar claro e compreensível.</p>
    ${!supportsRecognition() ? `<div class="no-speech-warning">Seu navegador não oferece reconhecimento de voz. Você ainda pode ouvir e praticar os exemplos, mas a avaliação de fala ficará pendente. Para usar o microfone, tente o Google Chrome ou o Microsoft Edge.</div>` : ""}
    <button class="btn ghost" onclick="state.micTestReturnTo='falar'; state.screen='mic-test'; render();">🎙️ Fazer teste de microfone e áudio</button>
  </div>`;
  html += renderSupportSettings();
  html += `<div class="card">
    <div class="eyebrow">Frases para praticar</div>
    <div class="options">
      ${speakingItems.map(p=>{
        const st = ensureSpeakStat(p.id);
        return `<button class="opt-btn" onclick="openFluencyPhrase('${p.id}')">${esc(p.en)} ${st.mastered?'✅':''}</button>`;
      }).join("")}
    </div>
  </div>`;
  return html;
}

function openFluencyPhrase(id){
  state.speakCurrent = id;
  const st = ensureSpeakStat(id);
  state.micResult = null;
  state.micTranscript = "";
  state.screen = "falar-pratica";
  render();
}

// A prática de fala é renderizada pela implementação MediaRecorder abaixo.
// Não há substituição digitada: falhas técnicas deixam a atividade de fala pendente.
function advanceSpeakStage(id){
  const st = ensureSpeakStat(id);
  st.stage = Math.min(3, st.stage+1);
  if(st.stage===3 && st.bestPct>=75) st.mastered = true;
  state.micResult = null;
  saveProgress();
  if(st.mastered && state.course && state.course.step==="speaking"){
    state.course.speakingCompleted = true;
    state.lessonProgress[activeLesson().id].speakingStatus="completed";state.course.maxUnlocked=Math.max(state.course.maxUnlocked,4);if(!state.course.completedSteps.includes("speaking"))state.course.completedSteps.push("speaking");
    state.course.step = "conversation";
    saveProgress();
    const nextId=(activeLesson().conversation[0]||{}).id;if(nextId)startConvo(nextId);else{state.screen="lesson-history";render();}
    return;
  }
  render();
}

function startConvo(id){
  const scn = CONVO_SCENARIOS.find(s=>s.id===id);
  state.convo.scenarioId = id;
  state.convo.stepIndex = 0;
  state.convo.npcLineIndex = 0;
  state.convo.waitingForUser = false;
  state.convo.log = [];
  state.convo.hintsUsedThisScenario = 0;
  state.convo.lastHeard = "";
  state.convo.lastResult = null;
  state.convo.finished = false;
  state.convo.typedFallback = "";
  state.convo.showText = true;
  state.convo.showTranslation = false;
  state.convo.hintBox = false;
  state.screen = "conversar-jogando";
  render();
  playConvoNpcLines();
}

function currentConvoScenario(){ return CONVO_SCENARIOS.find(s=>s.id===state.convo.scenarioId); }
function currentConvoStep(){ const scn = currentConvoScenario(); return scn ? scn.steps[state.convo.stepIndex] : null; }

function playConvoNpcLines(){
  const step = currentConvoStep();
  if(!step) return;
  const items = step.npc.map(line=>({text: state.settings.variety==="uk"?line.uk:line.us, variety: state.settings.variety}));
  items.forEach(it=> state.convo.log.push({who:"npc", text: it.text}));
  state.convo.waitingForUser = false;
  render();
  speakSequence(items, null, ()=>{ state.convo.waitingForUser = true; render(); });
}

function giveConvoHint(){
  state.convo.hintBox = true;
  state.convo.hintsUsedThisScenario++;
  render();
}

function matchConvoAccept(step, userText){
  const norm = normalize(userText);
  return step.accept.some(group=> group.every(kw=> norm.includes(normalize(kw))));
}

function submitConvoAnswer(text,modality="writing"){
  const step = currentConvoStep();
  if(!step || state.convo.lastResult || !(text||"").trim()) return;
  const usedHint=!!state.convo.hintBox;
  state.convo.log.push({who:"user", text,modality});
  state.convo.lastHeard = text;
  const ok = matchConvoAccept(step, text);
  state.convo.lastResult = ok ? "match" : "nomatch";
  state.convo.waitingForUser = false;
  state.convo.hintBox = false;
  recordAttempt(`conversation-${state.convo.scenarioId}-${state.convo.stepIndex}`,ok?"correct":"incorrect",usedHint?"supported":"independent",{modality});
  if(!ok) registerModuleError(`convo-${state.convo.scenarioId}-${state.convo.stepIndex}`,"conversation");
  saveProgress();
  render();
}
function continueConvoAnswer(){
  if(!state.convo.lastResult)return;
  state.convo.stepIndex++;
  const scn=currentConvoScenario();
  state.convo.lastResult=null;state.convo.lastHeard="";
  if(state.convo.stepIndex>=scn.steps.length)finishConvo(scn);else playConvoNpcLines();
}

  }, (err)=>{
    state.micListening = false;
    state.convo.lastHeard = "(não entendi)";
    state.convo.lastResult = "nomatch";
    render();
  }, ()=>{ state.micListening=false; render(); });
}

function finishConvo(scn){
  state.convo.finished = true;
  state.convo.unlockedScenarios = Math.max(state.convo.unlockedScenarios, scn.id+1);

  render();
}

function replayIntegratedDialogue(){state.helpStats.replays.dialogue=(state.helpStats.replays.dialogue||0)+1;saveProgress();playIntegratedDialogue();}
function playDialogueLine(i){const lesson=activeLesson(),t=lesson.dialogue[i];if(!t)return;const ch=characterOf(lesson,t.speaker)||{};startAmbience();state.helpStats.replays[t.id]=(state.helpStats.replays[t.id]||0)+1;saveProgress();speak(t.en,{audioUrl:t.audioUrl,character:ch,variety:ch.variety,rate:state.lesson.slowSpeed?.65:ch.rate||.92,onstart:()=>{state.lesson.dialoguePlayIndex=i;render();},onend:()=>{state.lesson.dialoguePlayIndex=-1;render();}});}
function toggleDialoguePause(){if(activeMediaAudio){if(activeMediaAudio.paused){activeMediaAudio.play();state.lesson.dialoguePaused=false;startAmbience();}else{activeMediaAudio.pause();state.lesson.dialoguePaused=true;ambienceAudio&&ambienceAudio.pause();}render();return;}if(!state.lesson.dialoguePlaying)return;if(state.lesson.dialoguePaused){window.speechSynthesis&&window.speechSynthesis.resume();state.lesson.dialoguePaused=false;startAmbience();}else{window.speechSynthesis&&window.speechSynthesis.pause();state.lesson.dialoguePaused=true;ambienceAudio&&ambienceAudio.pause();}render();}

function captureDraft(){const el=document.activeElement;if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&el.id)state.ui.drafts[el.id]=el.value;}
function restoreDrafts(){Object.entries(state.ui.drafts||{}).forEach(([id,val])=>{const el=document.getElementById(id);if(el&&!el.disabled&&!el.value)el.value=val;});}

function render(){const app=document.getElementById("app");if(!cloud.ready||!cloud.user||!cloud.user.emailVerified){app.innerHTML=renderAccessScreen();return;}ensureV2State();document.documentElement.classList.toggle("no-motion",state.settings.animationsEnabled===false);captureDraft();let html=renderTopbar();
  if(state.showRunBonus){app.innerHTML=html+renderRunBonus()+renderTabs()+renderSettingsModal()+renderAuthModal();restoreDrafts();return;}
  switch(state.screen){case"aprender":html+=renderDashboard();break;case"lesson-dialogue-v2":html+=renderDialogueV2();break;case"lesson-history":html+=renderLessonHistory();break;case"module-reinforcement":html+=renderModuleReinforcement();break;case"revisar":html+=renderReviewHub();break;case"progresso":html+=renderIntegratedProgress();break;case"praticar-intro":html+=renderPraticarIntro();break;case"praticar":case"revisar-praticando":case"desafio-praticando":html+=renderPraticando();break;case"grupo-completo":html+=renderGrupoCompleto();break;case"desafio":html+=renderDesafioIntro();break;case"desafio-fim":html+=renderDesafioFim();break;case"ouvir":html+=renderOuvirIntro();break;case"ouvir-frase":html+=renderOuvirFrase();break;case"ouvir-dialogo":html+=renderOuvirDialogo();break;case"falar":html+=renderFalarIntro();break;case"falar-pratica":html+=renderFalarPratica();break;case"conversar":html+=renderConversarIntro();break;case"conversar-jogando":html+=renderConversarJogando();break;case"mic-test":html+=renderMicTest();break;case"aula":html+=renderAulaIntro();break;case"aula-cena":html+=renderAulaCena();break;case"aula-expressao":html+=renderAulaExpressao();break;case"aula-comparacao":html+=renderAulaComparacao();break;case"aula-revisao":html+=renderAulaRevisao();break;default:state.screen="aprender";html+=renderDashboard();}
  html+=renderTabs()+renderWordHelpModal()+renderErrorDetailModal()+renderSettingsModal()+renderAuthModal();app.innerHTML=html;restoreDrafts();
}
function renderReviewHub(){const due=dueSrsExpressions(),weak=EXPR.filter(e=>state.stats[e.id]&&state.stats[e.id].wrong>0).sort((a,b)=>state.stats[b.id].wrong-state.stats[a.id].wrong).slice(0,8);const helped=Object.entries(state.helpStats.expressions).sort((a,b)=>b[1]-a[1]).slice(0,6);return `<div class="card"><div class="eyebrow">Revisar agora</div><h2 class="lesson-title">Revisões programadas</h2>${due.length?`<p class="lesson-sub">${due.length} expressão(ões) pronta(s) para revisar.</p><button class="btn" onclick="startReviewQueue()">Começar revisão →</button>`:`<div class="empty-state"><div class="big">✨</div>Nenhuma revisão vencida agora.</div>`}</div><div class="card"><div class="eyebrow">Erros recentes</div>${weak.length?weak.map(e=>`<div class="expr-row"><span>${esc(e.en)}</span><span class="mastery-pill low">${state.stats[e.id].wrong} erro(s)</span></div>`).join(""):"<p class='lesson-sub'>Nenhum erro recente.</p>"}</div><div class="card"><div class="eyebrow">Mais consultadas</div>${helped.length?helped.map(([k,n])=>`<div class="expr-row"><span>${esc(k)}</span><span class="mastery-pill mid">${n} ajuda(s)</span></div>`).join(""):"<p class='lesson-sub'>Nenhuma expressão consultada ainda.</p>"}</div>`;}
function renderIntegratedProgress(){const pct=integratedProgress(),lesson=activeLesson(),steps=courseStepsFor(lesson),speaking=state.lessonProgress[lesson.id].speakingStatus,m=lessonMetrics(lesson);return `<div class="card"><div class="eyebrow">Conclusão e aprendizagem</div><h2 class="lesson-title">Módulo concluído: ${pct}%</h2><div class="hero-progress"><div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><strong>${pct}%</strong></div><div class="stat-grid"><div class="stat-box"><div class="num">${m.performance}%</div><div class="lbl">desempenho nas avaliações</div></div><div class="stat-box"><div class="num">${m.persistent}</div><div class="lbl">conteúdos para reforçar</div></div><div class="stat-box"><div class="num">${m.independent}</div><div class="lbl">acertos sem ajuda</div></div><div class="stat-box"><div class="num">${m.pending}</div><div class="lbl">fala pendente</div></div></div><p class="lesson-sub">Concluir todas as atividades não significa dominar tudo. Erros persistentes ficam programados para revisão futura em contextos variados.</p><div class="transcript-box">Speaking: ${speaking==='completed'?'concluído':speaking==='pending-technical'?'pendente por problema técnico':speaking==='self-practice'?'praticado com apoio':'não iniciado'}</div><div class="lesson-path">${steps.map((s,i)=>`<div class="path-item ${i<currentCourseIndex()?'done':i===currentCourseIndex()?'current':'locked'}"><div class="path-icon">${i<currentCourseIndex()?'✅':s.icon}</div><div><div class="path-title">${esc(s.title)}</div><div class="path-sub">${esc(s.sub)}</div></div></div>`).join("")}</div></div><div class="card"><div class="eyebrow">Domínio por expressão</div>${(lesson.expressions||[]).map(e=>{const st=ensureSrs(e.id),p=ensureLessonProgress(e.id),label=p>=8&&st.noHelpStreak>=2?'dominado sem ajuda':p>=8?'concluído, ainda com apoio':p>=4?'compreendido':p?'em aprendizado':'não visto';return `<div class="expr-row"><span>${esc(e.text)}</span><span class="mastery-pill ${p>=8&&st.noHelpStreak>=2?'high':p?'mid':'low'}">${label}</span></div>`;}).join("")}</div>`;}

document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.ui&&state.ui.helpOpen){closeHelp();}else if(state.ui&&state.ui.helpWarning){closeProtectedHelp();}else if(state.ui&&state.ui.errorDetail){closeErrorDetail();}else if(state.ui&&state.ui.settingsOpen){closeSettings();}});

/* Correções de regressão nos fluxos antigos preservados */
const comparisonQuestionDefs=[
  {q:"O cliente estava com pouco de qual produto?",opts:["Leite","Pão","Ovos"],correct:"Leite",expressionId:"running-low-on",explain:"A fala diz que o leite está ficando pouco."},
  {q:"Onde fica o corredor de laticínios?",opts:["Perto da entrada","Perto do fundo da loja","No caixa"],correct:"Perto do fundo da loja",expressionId:"aisle",explain:"O funcionário indica o corredor perto do fundo da loja."},
  {q:"Como o cliente pagou?",opts:["No caixa de autoatendimento","Com um funcionário","Não pagou"],correct:"No caixa de autoatendimento",expressionId:"self-service-till",explain:"A conversa termina no caixa de autoatendimento."}
];
function comparisonQuestionsFor(lesson){const configured=lesson&&lesson.comparison&&lesson.comparison.questions;return Array.isArray(configured)&&configured.length?configured:lesson&&lesson.id==="supermercado-1"?comparisonQuestionDefs:[];}
function beginComparisonQuestions(){const qs=comparisonQuestionsFor(activeLesson());state.comparisonQuestions=Array(qs.length).fill(null);state.lesson.comparisonQuestionIndex=0;state.answered=false;state.selectedOption=null;state.lesson.comparisonStep=qs.length?"questions":"summary";render();}
function renderComparisonQuestions(lesson){const qs=comparisonQuestionsFor(lesson),i=Math.min(state.lesson.comparisonQuestionIndex||0,Math.max(0,qs.length-1));if(!qs.length){state.lesson.comparisonStep="summary";return renderComparisonSummary(lesson);}const q=qs[i],picked=(state.comparisonQuestions||[])[i],answered=picked!=null,correct=answered&&picked===q.correct;return `<div class="activity-meta"><span class="activity-tag">Compreensão final</span><span class="activity-counter">${i+1} / ${qs.length}</span></div><div class="progress-bar-wrap"><div class="progress-bar" style="width:${Math.round(i/qs.length*100)}%"></div></div><div class="prompt">${esc(q.q)}</div><div class="options">${q.opts.map(o=>{let cls="opt-btn";if(answered){if(o===q.correct)cls+=" correct";else if(o===picked)cls+=" incorrect";}return `<button type="button" class="${cls}" ${answered?'disabled':''} onclick="answerComparisonQ(${i},decodeArg('${encodeArg(o)}'))">${esc(o)}</button>`;}).join("")}</div>${answered?`<div class="feedback ${correct?'correct':'incorrect'}" role="status" aria-live="polite"><b>${correct?'✅ Resposta correta':'❌ Resposta incorreta'}</b>${esc(correct?'Você compreendeu esta parte da conversa.':q.explain||`A resposta correta é ${q.correct}.`)}</div>${!correct?`<button class="btn ghost" onclick="openErrorDetail('Entender meu erro',decodeArg('${encodeArg(q.explain||`A resposta correta é ${q.correct}.`)}'))">Entender meu erro</button>`:""}<button class="btn" onclick="continueComparisonQuestion(${i})">Continuar</button>`:""}`;}
function answerComparisonQ(i,val){const qs=comparisonQuestionsFor(activeLesson());if(i!==(state.lesson.comparisonQuestionIndex||0)||!qs[i]||(state.comparisonQuestions||[])[i]!=null)return;state.comparisonQuestions[i]=val;const correct=val===qs[i].correct;playFeedbackEffect(correct,`comparison:${activeLesson().id}:${i}`);recordAttempt(`comparison-${i}`,correct?"correct":"incorrect","independent",{picked:val});if(qs[i].expressionId)scheduleSrs(qs[i].expressionId,{correct,usedHint:false,context:"compreensão final",modality:"dialogue"});saveProgress();render();}
function markModuleCompleted(lesson=activeLesson()){if(state.course.moduleCompleted)return;state.course.comparisonCompleted=true;state.course.moduleCompleted=true;state.course.step="completed";if(!state.course.completedSteps.includes("comparison"))state.course.completedSteps.push("comparison");state.unlockedGroups=Math.min(TOTAL_GROUPS,Math.max(state.unlockedGroups,state.currentGroup+2));const lp=state.lessonProgress[lesson.id]||(state.lessonProgress[lesson.id]={});lp.completedAt=lp.completedAt||Date.now();}
async function continueComparisonQuestion(expectedIndex){const qs=comparisonQuestionsFor(activeLesson()),i=state.lesson.comparisonQuestionIndex||0;if(expectedIndex!==i||(state.comparisonQuestions||[])[i]==null)return;if(i+1<qs.length){state.lesson.comparisonQuestionIndex=i+1;state.selectedOption=null;state.answered=false;}else{state.lesson.comparisonStep="summary";markModuleCompleted(activeLesson());}await saveProgress();render();}
function renderComparisonSummary(lesson){const defs=comparisonQuestionsFor(lesson),answers=state.comparisonQuestions||[],correct=answers.filter((a,i)=>defs[i]&&a===defs[i].correct).length,completed=(lesson.expressions||[]).filter(e=>ensureLessonProgress(e.id)>=TOTAL_EXPR_STAGES),needsReview=(lesson.expressions||[]).filter(e=>{const s=ensureSrs(e.id);return s.wrong>0||s.hintsUsed>0||ensureLessonProgress(e.id)<TOTAL_EXPR_STAGES;}),m=lessonMetrics(lesson),helpCount=Object.values(state.helpStats.words||{}).reduce((a,b)=>a+b,0)+Object.values(state.helpStats.expressions||{}).reduce((a,b)=>a+b,0),minutes=Math.max(1,Math.round((Date.now()-(state.course.startedAt||Date.now()))/60000));state.course.comparisonCompleted=true;if(!state.course.completedSteps.includes("comparison"))state.course.completedSteps.push("comparison");saveProgress();return `<div class="eyebrow">Resumo final da aula</div><h2 class="lesson-title">Módulo concluído: 100%</h2><div class="stat-grid"><div class="stat-box"><div class="num">${m.performance}%</div><div class="lbl">desempenho</div></div><div class="stat-box"><div class="num">${correct}/${defs.length}</div><div class="lbl">compreensão final</div></div><div class="stat-box"><div class="num">${needsReview.length}</div><div class="lbl">itens para revisão</div></div><div class="stat-box"><div class="num">${minutes} min</div><div class="lbl">tempo informativo</div></div></div><div class="transcript-box">Speaking: ${state.lessonProgress[lesson.id].speakingStatus==='pending-technical'?'pendente':state.lessonProgress[lesson.id].speakingStatus==='not-started'?'não iniciado':'realizado'} · Ajudas consultadas: ${helpCount}</div><div class="eyebrow" style="margin-top:12px">Vocabulário e chunks estudados</div><div class="meaning-list">${(lesson.expressions||[]).map(e=>`<div class="meaning-item"><b>${esc(e.text)}</b> — ${esc(e.pt)} <button class="listen-btn" aria-label="Ouvir ${esc(e.text)}" onclick="speak(decodeArg('${encodeArg(e.text)}'))">🔊</button></div>`).join("")}</div><div class="eyebrow" style="margin-top:12px">Expressões concluídas</div><div class="transcript-box">${completed.map(e=>`• ${esc(e.text)}`).join("<br>")||"Continue praticando."}</div><div class="eyebrow" style="margin-top:12px">Programado para revisão</div><div class="transcript-box">${needsReview.map(e=>`• ${esc(e.text)}`).join("<br>")||"Nenhum item urgente; as revisões ocasionais continuam."}</div><button class="btn ghost" style="margin-top:14px" onclick="openDialogueReview()">Rever diálogo</button><button class="btn" style="margin-top:10px" onclick="goScreen('aprender')">Continuar</button>`;}
const renderComparisonSummaryOriginal=renderComparisonSummary;
renderComparisonSummary=function(lesson){if(!state.course.moduleCompleted)markModuleCompleted(lesson);const defs=comparisonQuestionsFor(lesson),answers=state.comparisonQuestions||[],correct=answers.filter((a,i)=>defs[i]&&a===defs[i].correct).length,needsReview=(lesson.expressions||[]).filter(e=>{const s=ensureSrs(e.id);return s.wrong>0||s.hintsUsed>0;}),m=lessonMetrics(lesson);return `<div style="text-align:center;font-size:44px">🎉</div><div class="eyebrow">Aula finalizada</div><h2 class="lesson-title">Módulo concluído!</h2><p class="lesson-sub">Muito bem! Seu progresso foi salvo e os pontos que precisam de prática voltarão nas revisões.</p><div class="stat-grid"><div class="stat-box"><div class="num">100%</div><div class="lbl">progresso</div></div><div class="stat-box"><div class="num">${m.performance}%</div><div class="lbl">desempenho</div></div><div class="stat-box"><div class="num">${correct}/${defs.length}</div><div class="lbl">compreensão</div></div><div class="stat-box"><div class="num">${needsReview.length}</div><div class="lbl">para revisar</div></div></div><div class="eyebrow" style="margin-top:12px">Expressões aprendidas</div><div class="meaning-list">${(lesson.expressions||[]).map(e=>`<div class="meaning-item"><b>${esc(e.text)}</b> — ${esc(e.pt)} <button class="listen-btn" aria-label="Ouvir ${esc(e.text)}" onclick="speak(decodeArg('${encodeArg(e.text)}'))">🔊</button></div>`).join("")}</div>${needsReview.length?`<div class="eyebrow" style="margin-top:12px">Programado para revisão</div><div class="transcript-box">${needsReview.map(e=>`• ${esc(e.text)}`).join("<br>")}</div>`:""}<button class="btn" style="margin-top:14px" onclick="finishCompletedModule()">Voltar para o início</button>`;};
async function finishCompletedModule(){markModuleCompleted(activeLesson());await saveProgress();state.screen="aprender";render();}
function answerReviewLight(exprId,text){if(state.answered)return;const expr=findExpr(exprId).expr,n=normalize(text),keywords=normalize(expr.pt).split(" ").filter(w=>w.length>3);state.answered=true;state.lastResult=keywords.some(w=>n.includes(w))&&n.length>=8;playFeedbackEffect(state.lastResult,`review:${exprId}:${ensureLessonProgress(exprId)}`);recordAttempt(exprId,state.lastResult?"correct":"incorrect","independent",{modality:"writing"});scheduleSrs(exprId,{correct:state.lastResult,usedHint:false,context:"recuperação final",modality:"writing"});if(!state.lastResult)registerModuleError(exprId,"review");saveProgress();render();}

/* boot */
hydrateBuiltInLesson();
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = ()=>{};
}
(async function boot(){render();await initFirebase();await loadProgress();})();
